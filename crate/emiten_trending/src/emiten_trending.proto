syntax = "proto3";

package emiten_trending;

service EmitenTrending {
  // On-demand sekali: baca Scylla MV emiten_trending_by_tahun_bulan_tanggal (full columns, 1 query).
  // Tanpa rate limit / jam operasional. Request: tahun_bulan_tanggal (YYYY-MM-DD).
  // Auth: Bearer login. Response: rows.
  rpc GetAllEmitenTrendingFromScylla(GetAllEmitenTrendingFromScyllaRequest)
      returns (GetAllEmitenTrendingResponse);

  // Invoke RPC langsung (admin): tanpa batas hari/jam; rate limit global 1× / 5 menit.
  // Scrape Stockbit market-mover (TOP_GAINER + TOP_LOSER) → upsert invezgood.emiten_trending.
  // Setelah upsert, baca ulang dari Scylla (hari ini) lalu return rows.
  rpc GetLatestEmitenTrendingFromStockbit(GetLatestEmitenTrendingFromStockbitRequest)
      returns (GetAllEmitenTrendingResponse);

  // Butuh login: metadata authorization: Bearer <token> (dari user.Login).
  // Alur: 
  // (1) GET api.invezgo.com/analysis/top/change?date={YYYY-MM-DD hari ini}&filter_column=change → upsert ke invezgood.emiten_trending saja (bukan return ke client);
  // (2) baca ulang MV emiten_trending_by_tahun_bulan_tanggal hari ini → response ke client. Response rows **selalu dari Scylla**; kosong bila MV hari ini tidak punya baris. Invezgo HTTP/parse/upsert gagal → internal (client tidak terima JSON API).
  // Mapping upsert: gain→gainer, loss→loser; PK agg=`{date}_{code}`; emiten_icon Stockbit CDN;
  // long_name/price/change/value/volume dari API; sector lookup stock_list (tinyint bila numerik);
  // freq null; updated_at waktu server.
  // Auto dari IsStockbitReady poller (paralel dengan scrape Chrome portofolio/pending_order; HTTP tanpa browser) bila Stockbit ready,
  // hanya pada jam operasional (waktu server lokal): Senin–Kamis 09:00–12:00 & 13:30–16:00; Jumat 09:00–11:30 & 14:00–16:00,
  // dan bukan hari libur (Sabtu/Minggu atau tanggal ada di invezgood.hari_libur — sumber sama GetAllHariLibur).
  // GET Invezgo (manual RPC) hanya pada jam operasional dan bukan libur; di luar itu skip GET, tetap baca MV hari ini.
  // Rate limit 1× / 5 menit hanya bila GET Invezgo dijalankan (shared dengan GetLatestEmitenTrendingFromStockbit).
  rpc GetLatestEmitenTrendingFromInvezgo(GetLatestEmitenTrendingFromInvezgoRequest)
      returns (GetAllEmitenTrendingResponse);
}

message GetAllEmitenTrendingFromScyllaRequest {
  string tahun_bulan_tanggal = 1;
}

message GetLatestEmitenTrendingFromStockbitRequest {}

message GetLatestEmitenTrendingFromInvezgoRequest {}

message EmitenTrendingRow {
  string agg_tahun_bulan_tanggal_emiten_name = 1;
  string tahun_bulan_tanggal = 2;
  string gainer_or_loser = 3;
  string emiten_name = 4;
  double price = 5;
  double price_change = 6;
  string value = 7;
  string volume = 8;
  string updated_at = 9;
  string emiten_icon = 10;
  string freq = 11;
  string long_name = 12;
  int32 sector = 13;
}

message GetAllEmitenTrendingResponse {
  repeated EmitenTrendingRow rows = 1;
}
