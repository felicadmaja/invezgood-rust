syntax = "proto3";

package emiten_trending;

service EmitenTrending {
  // On-demand sekali: baca Scylla MV emiten_trending_by_tahun_bulan_tanggal (full columns, 1 query).
  // Tanpa rate limit / jam operasional. Request: tahun_bulan_tanggal (YYYY-MM-DD).
  // Auth: Bearer login. Response: rows.
  rpc GetAllEmitenTrendingFromScylla(GetAllEmitenTrendingFromScyllaRequest)
      returns (GetAllEmitenTrendingResponse);

  // Invoke RPC langsung (admin): tanpa batas hari/jam; rate limit global 1× / 5 menit.
  // Auto dari IsStockbitReady poller: hanya Senin–Jumat 09:00–12:15 & 13:30–16:15 bila Stockbit ready
  // (poller selalu jalan tanpa perlu subscriber). Scrape Stockbit market-mover (TOP_GAINER + TOP_LOSER)
  // → upsert invezgood.emiten_trending. Setelah upsert, baca ulang dari Scylla (hari ini) lalu return rows.
  rpc GetLatestEmitenTrendingFromStockbit(GetLatestEmitenTrendingFromStockbitRequest)
      returns (GetAllEmitenTrendingResponse);
}

message GetAllEmitenTrendingFromScyllaRequest {
  string tahun_bulan_tanggal = 1;
}

message GetLatestEmitenTrendingFromStockbitRequest {}

message EmitenTrendingRow {
  string agg_tahun_bulan_tanggal_emiten_name = 1;
  string tahun_bulan_tanggal = 2;
  string gainer_or_loser = 3;
  string emiten_name = 4;
  double price = 5;
  double price_change = 6;
  string value = 7;
  string volume = 8;
  string updated_at = 9;
  string emiten_icon = 10;
  string freq = 11;
  string long_name = 12;
  int32 sector = 13;
}

message GetAllEmitenTrendingResponse {
  repeated EmitenTrendingRow rows = 1;
}
