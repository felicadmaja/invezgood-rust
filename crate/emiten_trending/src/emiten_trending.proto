syntax = "proto3";

package emiten_trending;

service EmitenTrending {
  // Daftar trending per tanggal via MV `emiten_trending_by_tahun_bulan_tanggal`.
  rpc GetAllEmitenTrendingFromScylla(GetAllEmitenTrendingFromScyllaRequest)
      returns (GetAllEmitenTrendingResponse);

  // On-demand scrape Stockbit lalu stream snapshot `emiten_trending` hari ini.
  // Hanya jalan saat RPC dipanggil. Hanya jam server 07:00–17:00
  // (failed precondition: "Diluar jam 07:00 - 17:00"). Tidak berlaku untuk bin worker.
  // Rate limit: maksimal 1× per 5 menit untuk semua user
  // (failed precondition jika terlalu cepat).
  //
  // Urutan tulis ke Scylla (satu sesi browser/login, berurutan):
  // (1) `emiten_trending` — API market-mover TOP_GAINER, lalu TOP_LOSER (per baris emiten
  //     yang muncul dari Stockbit). Setiap upsert (baru atau overwrite PK hari ini) mengisi
  //     `updated_at` = now. Setelah setiap insert baris hari ini yang benar-benar baru
  //     (PK `YYYY-MM-DD_EMITEN` belum ada), upsert `emiten_trending_count_by_name`:
  //     appearance_count += 1, last_tahun_bulan_tanggal = hari ini, updated_at = now.
  //     Baris yang sudah ada di tanggal yang sama tidak menambah count lagi.
  // (2) `emiten_list` — seed INSERT `emiten_name` + `long_name` untuk kode movers yang belum ada
  //     di tabel (contoh TMPO); baris yang sudah ada tidak ditimpa.
  // (3) Baca ulang daftar `emiten_name` dari `emiten_list` (token-ring; sudah termasuk seed),
  //     movers diproses dulu. Per kode: upsert key_stats + corporate_action + company_profile
  //     + net_income + long_name + emiten_icon + update_at hanya bila:
  //       - baris belum ada / baru di-seed, ATAU
  //       - `update_at` kosong / usia sudah ≥ 30 hari
  //     (skip bila `update_at` masih < 30 hari dan emiten_icon sudah terisi).
  //     Tidak mengisi sector / is_konglomerasi / is_fundamental_solid / is_blue_chip /
  //     is_plan_to_trade / catatan / catatan_owner / foto_owner.
  // (4) `bandarmology` — scrape marketdetectors hanya untuk emiten_name TOP_GAINER +
  //     TOP_LOSER dari invoke ini (bukan seluruh emiten_list), dengan aturan skip sama
  //     `bandarmology_worker` / RPC GetBandarmologyFromStockbit:
  //     bulan berjalan skip fetch bila `updated_at` masih hari ini; kolom minggu backfill
  //     bila kosong; historis skip bila bulan lalu sudah ada / per bulan sudah ada.
  //
  // Setelah scrape selesai, RPC membaca ulang `emiten_trending` hari ini dan stream hasilnya.
  // Request kosong. Wajib Authorization: Bearer <JWT valid>.
  rpc GetLatestEmitenTrendingFromStockbit(GetLatestEmitenTrendingFromStockbitRequest)
      returns (stream GetAllEmitenTrendingResponse);
}

message GetAllEmitenTrendingFromScyllaRequest {
  // Format YYYY-MM-DD, contoh "2026-07-16".
  string tahun_bulan_tanggal = 1;
}

message GetLatestEmitenTrendingFromStockbitRequest {}

message EmitenTrendingRow {
  string agg_tahun_bulan_tanggal_emiten_name = 1;
  string tahun_bulan_tanggal = 2;
  string gainer_or_loser = 3;
  string emiten_name = 4;
  double price = 5;
  double price_change = 6;
  string value = 7;
  string volume = 8;
  // RFC3339 / ISO-8601 timestamp string (kosong bila null di Scylla).
  string updated_at = 9;
  // Path object GCS icon emiten.
  string emiten_icon = 10;
  // Frekuensi transaksi (kolom Freq Movers).
  string freq = 11;
  // Nama perusahaan panjang.
  string long_name = 12;
  // Kode sektor (sama EmitenSector / emiten_list.sector tinyint); 0 = UNSPECIFIED.
  int32 sector = 13;
}

message GetAllEmitenTrendingResponse {
  repeated EmitenTrendingRow rows = 1;
}
