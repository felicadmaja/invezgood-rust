syntax = "proto3";

package portofolio_catatan;

service PortofolioCatatan {
  // Insert satu catatan ke tabel Scylla `portofolio_catatan` (PK emiten_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc InsertPortofolioCatatan(InsertPortofolioCatatanRequest) returns (InsertPortofolioCatatanResponse);

  // Baca semua catatan dari tabel Scylla `portofolio_catatan` (token-ring scan).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetAllPortofolioCatatan(GetAllPortofolioCatatanRequest) returns (GetAllPortofolioCatatanResponse);

  // Baca satu catatan berdasarkan PK emiten_name.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetPortofolioCatatanByEmitenName(GetPortofolioCatatanByEmitenNameRequest) returns (GetPortofolioCatatanByEmitenNameResponse);

  // Update catatan untuk satu emiten (PK emiten_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc UpdatePortofolioCatatan(UpdatePortofolioCatatanRequest) returns (UpdatePortofolioCatatanResponse);

  // Hapus satu catatan (PK emiten_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc DeletePortofolioCatatan(DeletePortofolioCatatanRequest) returns (DeletePortofolioCatatanResponse);
}

message PortofolioCatatanRow {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  string emiten_name = 1;
  string catatan = 2;
}

message InsertPortofolioCatatanRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  string emiten_name = 1;
  string catatan = 2;
}

message InsertPortofolioCatatanResponse {
  bool success = 1;
  string message = 2;
}

message GetAllPortofolioCatatanRequest {}

message GetAllPortofolioCatatanResponse {
  repeated PortofolioCatatanRow rows = 1;
}

message GetPortofolioCatatanByEmitenNameRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  string emiten_name = 1;
}

message GetPortofolioCatatanByEmitenNameResponse {
  PortofolioCatatanRow row = 1;
}

message UpdatePortofolioCatatanRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  string emiten_name = 1;
  string catatan = 2;
}

message UpdatePortofolioCatatanResponse {
  bool success = 1;
  string message = 2;
}

message DeletePortofolioCatatanRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  string emiten_name = 1;
}

message DeletePortofolioCatatanResponse {
  bool success = 1;
  string message = 2;
}
