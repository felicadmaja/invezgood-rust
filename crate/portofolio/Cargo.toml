[package]
name = "portofolio"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
futures = "0.3"
scylla = { version = "1.5", features = ["chrono-04"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tonic = "0.12"
prost = "0.13"
user = { path = "../user" }
worker_scrapping = { path = "../../worker_scrapping" }

[build-dependencies]
tonic-build = "0.12"
