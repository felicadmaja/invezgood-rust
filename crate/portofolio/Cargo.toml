[package]
name = "portofolio"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "portofolio"
path = "src/main.rs"

[dependencies]
dotenvy = "0.15"
futures-util = "0.3"
prost = { version = "0.13", features = ["std", "derive"] }
scylla = "1.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tonic = { version = "0.12", features = ["transport"] }
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"
tonic-build = "0.12"
