syntax = "proto3";

package portofolio;

service Portofolio {
  // Tanpa parameter request; mengembalikan semua baris dari tabel Scylla `portofolio`.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetAllPortofolioFromScylla(GetAllPortofolioFromScyllaRequest)
      returns (GetAllPortofolioFromScyllaResponse);

  // Scrape semua holdings dari Stockbit lalu upsert `portofolio`.
  // Alur sama `portofolio_worker`: login → START TRADING/PIN bila perlu →
  // DOM `portofolio_equity` → GET carina.stockbit.com/portfolio/v2/list →
  // pastikan emiten_list + bandarmology → TRUNCATE+insert `portofolio`.
  // Request kosong. Response: repeated PortofolioRow setelah scrape.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetAllPortofolioFromStockbit(GetAllPortofolioFromStockbitRequest)
      returns (GetAllPortofolioFromStockbitResponse);

      
  // HISTORY DARI PEMBELIAN    
  // Ambil riwayat order per emiten dari Stockbit lalu timpa kolom `portofolio.history`.
  // Alur: login → START TRADING/PIN bila perlu →
  // GET carina.stockbit.com/order/v2/list?filter_criteria.stock_code={emiten_name}
  // → SET history = map baru (timpa ulang, bukan push).
  // Key map = waktu order (`time.match`, fallback `time.open` / `time.order`) RFC3339.
  // emiten_name: tepat 4 huruf; dinormalisasi ke UPPERCASE.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetPortofolioHistoryByEmitenName(GetPortofolioHistoryByEmitenNameRequest)
      returns (GetPortofolioHistoryByEmitenNameResponse);
}

message GetAllPortofolioFromScyllaRequest {}

message GetAllPortofolioFromStockbitRequest {}

message GetPortofolioHistoryByEmitenNameRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE (asbi → ASBI).
  string emiten_name = 1;
}

message PortofolioHistoryItem {
  string order_id = 1;
  string message = 2;
  string symbol = 3;
  string side = 4;
  int32 lot_done = 5;
  double price_average = 6;
  double amount_matched = 7;
}

message PortofolioRow {
  string emiten_name = 1;
  string emiten_icon = 2;
  int64 balance_lot = 3;
  int64 available_lot = 4;
  double average_price = 5;
  double current_price = 6;
  double invested = 7;
  double market_value = 8;
  double potential_p_l = 9;
  double percentage = 10;
  string long_name = 11;
  // Key = timestamp RFC3339 (contoh "2026-07-20T07:20:55Z").
  map<string, PortofolioHistoryItem> history = 12;
}

message GetAllPortofolioFromScyllaResponse {
  repeated PortofolioRow rows = 1;
}

message GetAllPortofolioFromStockbitResponse {
  bool success = 1;
  string message = 2;
  repeated PortofolioRow rows = 3;
}

message GetPortofolioHistoryByEmitenNameResponse {
  bool success = 1;
  string message = 2;
  // Baris portofolio setelah history di-timpa; kosong jika gagal / emiten belum ada di Scylla.
  PortofolioRow row = 3;
}
