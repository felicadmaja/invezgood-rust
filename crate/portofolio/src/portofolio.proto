syntax = "proto3";

package portofolio;

service Portofolio {
  // Tanpa parameter request; mengembalikan semua baris dari tabel Scylla `portofolio`.
  // Hanya role ADMIN; selain itu PERMISSION_DENIED "Harus admin !".
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetAllPortofolioFromScylla(GetAllPortofolioFromScyllaRequest)
      returns (GetAllPortofolioFromScyllaResponse);

  // Baca satu baris `portofolio` via PK `emiten_name`.
  // Request: emiten_name (4 huruf, dinormalisasi uppercase).
  // Response: PortofolioRow (kosong/`row` unset bila tidak ada).
  // Hanya role ADMIN; selain itu PERMISSION_DENIED "Harus admin !".
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetPortofolioFromScyllaByEmitenName(GetPortofolioFromScyllaByEmitenNameRequest)
      returns (GetPortofolioFromScyllaByEmitenNameResponse);

  // Scrape holdings + equity dari GET carina.stockbit.com/portfolio/v2/list
  // lalu upsert `portofolio` (`data.results`) dan `portofolio_equity` (`data.summary`).
  // Alur: login → START TRADING/PIN bila perlu → Bearer trading → GET API →
  // pastikan emiten_list + bandarmology → TRUNCATE+insert `portofolio`.
  // Tidak menulis `portofolio_bandarmology`.
  // Rate limit: maksimal 1× per 3 menit untuk semua user
  // (failed precondition jika terlalu cepat).
  // Hanya hari operasional Senin–Jumat dan jam server 08:45–12:15 serta 13:25–16:15
  // (failed precondition: "Diluar hari operasional Senin-Jumat..." atau
  // "Diluar jam 08:45-12:15 dan 13:25-16:15").
  // Tidak berlaku untuk bin worker_scrapping.
  // Juga dijalankan otomatis saat poller IsStockbitReady = ready (hari + jam + rate limit sama),
  // bersama history holdings, pending_order, dan emiten_trending.
  // Request kosong. Response: repeated PortofolioRow setelah scrape.
  // Hanya role ADMIN; selain itu PERMISSION_DENIED "Harus admin !".
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetAllPortofolioFromStockbit(GetAllPortofolioFromStockbitRequest)
      returns (GetAllPortofolioFromStockbitResponse);
}

message GetAllPortofolioFromScyllaRequest {}

message GetAllPortofolioFromStockbitRequest {}

message GetPortofolioFromScyllaByEmitenNameRequest {
  string emiten_name = 1;
}

message GetPortofolioFromScyllaByEmitenNameResponse {
  PortofolioRow row = 1;
}
message PortofolioRow {
  string emiten_name = 1;
  string emiten_icon = 2;
  int64 balance_lot = 3;
  int64 available_lot = 4;
  double average_price = 5;
  double current_price = 6;
  double invested = 7;
  double market_value = 8;
  double potential_p_l = 9;
  double percentage = 10;
  string long_name = 11;
}

message GetAllPortofolioFromScyllaResponse {
  repeated PortofolioRow rows = 1;
}

message GetAllPortofolioFromStockbitResponse {
  bool success = 1;
  string message = 2;
  repeated PortofolioRow rows = 3;
}
