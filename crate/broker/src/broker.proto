syntax = "proto3";

package broker;

service Broker {
  // Memerlukan user login. Kirim metadata: authorization: Bearer <token> (token dari user.Login).

  // Baca semua baris invezgood.broker. Bila kosong → GET api.invezgo.com/analysis/list/broker
  // → upsert Scylla (code→broker_code, name). Bearer INVEZGO_BEARER_TOKEN. Response: daftar broker.
  rpc GetAllBrokers(GetAllBrokersRequest) returns (GetAllBrokersResponse);

  // Baca invezgood.broker by PK broker_code. Bila tabel kosong → sync dari Invezgo dulu.
  // Response: satu BrokerRow atau not_found.
  rpc GetBrokerByCode(GetBrokerByCodeRequest) returns (GetBrokerByCodeResponse);

  // Update kolom name/tipe/asosiasi/catatan/is_huge di invezgood.broker by PK broker_code.
  // Field optional: hanya yang diisi yang diupdate. Broker harus sudah ada → not_found bila tidak ada.
  // Response: BrokerRow terbaru.
  rpc UpdateBrokerByCode(UpdateBrokerByCodeRequest) returns (UpdateBrokerByCodeResponse);

  // Hapus baris invezgood.broker by PK broker_code. Broker harus ada → not_found bila tidak ada.
  // Response: success + message.
  rpc DeleteBrokerByCode(DeleteBrokerByCodeRequest) returns (DeleteBrokerByCodeResponse);

  // Cek invezgood.broker_stalker by PK (broker_code, tahun_bulan YYYY-MM).
  // Hit → return baris cache. Miss → GET api.invezgo.com/analysis/stalker/list/{broker}
  // ?from=YYYY-MM-01&to=akhir-bulan&investor=all&market=RG (Bearer INVEZGO_BEARER_TOKEN),
  // upsert summary+list ke Scylla, return BrokerStalkerRow.
  rpc BrokerStalkerFromInvezgo(BrokerStalkerFromInvezgoRequest) returns (BrokerStalkerFromInvezgoResponse);
}

enum TipeBroker {
  LOCAL = 0;
  FOREIGN = 1;
  GOVERNMENT = 2;
}

message GetAllBrokersRequest {}

message GetAllBrokersResponse {
  repeated BrokerRow items = 1;
}

message GetBrokerByCodeRequest {
  string broker_code = 1;
}

message GetBrokerByCodeResponse {
  BrokerRow item = 1;
}

message UpdateBrokerByCodeRequest {
  string broker_code = 1;
  optional string name = 2;
  optional TipeBroker tipe = 3;
  optional string asosiasi = 4;
  optional string catatan = 5;
  optional bool is_huge = 6;
}

message UpdateBrokerByCodeResponse {
  BrokerRow item = 1;
}

message DeleteBrokerByCodeRequest {
  string broker_code = 1;
}

message DeleteBrokerByCodeResponse {
  bool success = 1;
  string message = 2;
}

message BrokerStalkerFromInvezgoRequest {
  string broker_code = 1;
  string tahun_bulan = 2; // YYYY-MM
}

message BrokerStalkerFromInvezgoResponse {
  BrokerStalkerRow item = 1;
}

message BrokerRow {
  string broker_code = 1;
  string name = 2;
  optional TipeBroker tipe = 3;
  string asosiasi = 4;
  string catatan = 5;
  string updated_at = 6;
  bool is_huge = 7;
}

// Baris invezgood.broker_stalker (list = list<frozen<map<text,text>>>).
message BrokerStalkerListItem {
  map<string, string> fields = 1;
}

message BrokerStalkerRow {
  string broker_code = 1;
  string tahun_bulan = 2;
  map<string, string> summary = 3;
  repeated BrokerStalkerListItem list = 4;
}
