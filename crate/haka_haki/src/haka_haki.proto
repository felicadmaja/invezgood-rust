syntax = "proto3";

package haka_haki;

service HakaHaki {
  // Memerlukan user login. Kirim metadata: authorization: Bearer <token>.
  // GET api.invezgo.com/analysis/momentum-chart/{code}?date={tahun_bulan_tanggal}&range={range}&scope=volume
  // → upsert invezgood.haka_haki per titik waktu, lalu return items ke client.
  // tahun_bulan_tanggal libur via market_holiday::is_market_holiday_on (Sabtu/Minggu, ARRAY_HOLIDAY,
  // atau hari ini Yahoo BBCA volume=0 setelah 10:00) → success=false message "hari libur", tidak GET Invezgo.
  // Bila tahun_bulan_tanggal bukan hari ini: cache Redis key `{code}:{YYYY-MM-DD}:{range}` (hanya bila items tidak kosong).
  // Jam operasional (waktu server lokal): 
  // - Senin–Kamis 09:00–12:00 & 13:30–16:00;
  // - Jumat 09:00–11:30 & 14:00–16:00 — hit API live.
  // Setelah 16:00 (Senin–Jumat): baca cache EOD (Moka→Redis); bila miss hit API 1x lalu simpan.
  rpc GetHakaHakiFromInvezgo(GetHakaHakiFromInvezgoRequest)
      returns (GetHakaHakiFromInvezgoResponse);

  // Baca invezgood.haka_haki via MV haka_haki_by_agg_code_tahun_bulan_tanggal.
  // Request: code + tahun_bulan_tanggal (YYYY-MM-DD) wajib.
  // tahun_bulan_tanggal libur via market_holiday::is_market_holiday_on (Sabtu/Minggu, ARRAY_HOLIDAY,
  // atau hari ini Yahoo BBCA volume=0) → success=false message "hari libur".
  rpc GetHakaHakiFromScylla(GetHakaHakiFromScyllaRequest)
      returns (GetHakaHakiFromScyllaResponse);
}

message GetHakaHakiFromInvezgoRequest {
  string code = 1;
  // Tanggal YYYY-MM-DD. Libur (Sabtu/Minggu, ARRAY_HOLIDAY, Yahoo BBCA bila hari ini) → "hari libur".
  // Bukan hari ini → Redis cache.
  string tahun_bulan_tanggal = 2;
  // Default 5 bila tidak diisi.
  optional int32 range = 3;
}

message GetHakaHakiFromScyllaRequest {
  string code = 1;
  // Tanggal YYYY-MM-DD → MV agg `{code}_{YYYY-MM-DD}`. Libur ditolak via market_holiday.
  string tahun_bulan_tanggal = 2;
}

message HakaHakiPoint {
  string time = 1;
  int64 value = 2;
  int64 buy = 3;
  int64 sell = 4;
}

message GetHakaHakiFromInvezgoResponse {
  bool success = 1;
  string message = 2;
  string code = 3;
  string tahun_bulan_tanggal = 4;
  repeated HakaHakiPoint items = 5;
}

message GetHakaHakiFromScyllaResponse {
  bool success = 1;
  string message = 2;
  repeated HakaHakiPoint items = 3;
}
