syntax = "proto3";

package config_fundamental;

service ConfigFundamental {
  // Scan semua baris Scylla `invezgood.config_fundamental` (PK key, kolom value/description).
  // Read-only; wajib Authorization: Bearer JWT valid — UNAUTHENTICATED bila token invalid.
  // Response: repeated ConfigFundamentalRow; error internal bila query Scylla gagal.
  rpc GetAllConfigFundamental(GetAllConfigFundamentalRequest)
      returns (GetAllConfigFundamentalResponse);

  // Insert baris baru Scylla `invezgood.config_fundamental` (PK key unik; key di-trim).
  // Wajib Authorization: Bearer JWT valid; `success=false` bila key kosong/setelah trim atau sudah ada.
  // Side effect: INSERT Scylla; error internal bila query gagal.
  rpc InsertConfigFundamental(InsertConfigFundamentalRequest)
      returns (InsertConfigFundamentalResponse);

  // Update kolom value/description Scylla `invezgood.config_fundamental` untuk PK key (key di-trim, tidak diubah).
  // Wajib Authorization: Bearer JWT valid; `success=false` bila key kosong/setelah trim atau tidak ditemukan.
  // Side effect: UPDATE Scylla; error internal bila query gagal.
  rpc UpdateConfigFundamental(UpdateConfigFundamentalRequest)
      returns (UpdateConfigFundamentalResponse);

  

  // Hapus baris Scylla `invezgood.config_fundamental` by PK key (key di-trim).
  // Wajib Authorization: Bearer JWT valid; `success=false` bila key kosong/setelah trim atau tidak ditemukan.
  // Side effect: DELETE Scylla; error internal bila query gagal.
  rpc DeleteConfigFundamental(DeleteConfigFundamentalRequest)
      returns (DeleteConfigFundamentalResponse);
}

message ConfigFundamentalRow {
  string key = 1;
  double value = 2;
  string description = 3;
}

message GetAllConfigFundamentalRequest {}

message GetAllConfigFundamentalResponse {
  repeated ConfigFundamentalRow rows = 1;
}

message UpdateConfigFundamentalRequest {
  string key = 1; // di-trim di server
  double value = 2;
  string description = 3;
}

message UpdateConfigFundamentalResponse {
  bool success = 1;
  string message = 2;
}

message InsertConfigFundamentalRequest {
  string key = 1; // di-trim di server
  double value = 2;
  string description = 3;
}

message InsertConfigFundamentalResponse {
  bool success = 1;
  string message = 2;
}

message DeleteConfigFundamentalRequest {
  string key = 1; // di-trim di server
}

message DeleteConfigFundamentalResponse {
  bool success = 1;
  string message = 2;
}
