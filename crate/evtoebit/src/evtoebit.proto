syntax = "proto3";

package evtoebit;

service EvToEbit {
  // Agregat median EV/EBIT (dan EV/EBITDA) per sektor emiten BEI (IDX-IC).
  // Sumber: kolom sector invezgood.stock_list + Yahoo Finance (.JK) untuk market cap,
  // neraca, laba rugi TTM via Rust reqwest (Yahoo crumb + timeseries).
  // winsorize multiple >100×. Flag `n<3` bila emiten valid < 3; agregat per sektor saja.
  // Publik — tanpa JWT. Handler: EvToEbitService::fetch_median_from_yahoo_finance (cache Moka, compute Yahoo).
  // Upsert invezgood.evtoebit hanya scheduler (jam 17:00 lokal, env EVTOEBIT_SYNC_HOUR/MINUTE) atau example seed.
  // Response: repeated MedianEvMultipleRow; internal bila compute gagal.
  rpc GetMedianEVToEbitdaFromYahooFinance(GetMedianEVToEbitdaFromYahooFinanceRequest) returns (GetMedianEVToEbitdaFromYahooFinanceResponse);

  // Baca agregat median dari invezgood.evtoebit (read-only, tanpa fetch/parse Yahoo Finance).
  // Publik — tanpa JWT. Response: repeated MedianEvMultipleRow + updated_at; internal bila query Scylla gagal.
  rpc GetMedianEVToEbitdaFromScylla(GetMedianEVToEbitdaFromScyllaRequest) returns (GetMedianEVToEbitdaFromScyllaResponse);
}

// Satu baris agregat median multiple per sektor BEI.
message MedianEvMultipleRow {
  string sektor = 1;
  reserved 2;
  reserved "sub_sektor";
  int32 n = 3;
  double median_ev_ebit = 4;
  double p25_ev_ebit = 5;
  double p75_ev_ebit = 6;
  double median_ev_ebitda = 7;
  string flag = 8; // "n<3" bila jumlah emiten valid < min valid (default 3)
  optional int64 updated_at = 9; // Unix seconds UTC; diisi saat baca dari Scylla
}

message GetMedianEVToEbitdaFromYahooFinanceRequest {}

message GetMedianEVToEbitdaFromYahooFinanceResponse {
  bool success = 1;
  string message = 2;
  repeated MedianEvMultipleRow rows = 3;
}

message GetMedianEVToEbitdaFromScyllaRequest {}

message GetMedianEVToEbitdaFromScyllaResponse {
  bool success = 1;
  string message = 2;
  repeated MedianEvMultipleRow rows = 3;
}
