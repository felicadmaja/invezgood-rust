syntax = "proto3";

package evtoebit;

service EvToEbit {
  // Agregat median EV/EBIT (dan EV/EBITDA) per sektor/sub-sektor emiten BEI (IDX-IC).
  // Sumber: daftar saham idx.co.id (pemetaan kode → sektor/sub-sektor) + Yahoo Finance (.JK)
  // untuk market cap, neraca, laba rugi TTM via Rust reqwest (Yahoo crumb + timeseries).
  // winsorize multiple >100×. Flag `n<5` bila emiten valid < 5; agregat per sektor + sub-sektor.
  // Hasil compute di-upsert ke invezgood.evtoebit (kolom updated_at = waktu upsert).
  // Response: repeated MedianEvMultipleRow; error internal bila fetch/parse gagal.
  rpc GetMedianEVToEbitdaFromYahooFinance(GetMedianEVToEbitdaFromYahooFinanceRequest) returns (GetMedianEVToEbitdaFromYahooFinanceResponse);

  // Baca agregat median dari invezgood.evtoebit (read-only, tanpa fetch/parse Yahoo Finance).
  // Response: repeated MedianEvMultipleRow + updated_at per baris; internal bila query Scylla gagal.
  rpc GetMedianEVToEbitdaFromScylla(GetMedianEVToEbitdaFromScyllaRequest) returns (GetMedianEVToEbitdaFromScyllaResponse);
}

// Satu baris agregat median multiple per pasangan sektor + sub-sektor BEI.
message MedianEvMultipleRow {
  string sektor = 1;
  string sub_sektor = 2;
  int32 n = 3;
  double median_ev_ebit = 4;
  double p25_ev_ebit = 5;
  double p75_ev_ebit = 6;
  double median_ev_ebitda = 7;
  string flag = 8; // "n<5" bila jumlah emiten valid < min valid (default 5)
  optional int64 updated_at = 9; // Unix seconds UTC; diisi saat baca dari Scylla
}

message GetMedianEVToEbitdaFromYahooFinanceRequest {}

message GetMedianEVToEbitdaFromYahooFinanceResponse {
  bool success = 1;
  string message = 2;
  repeated MedianEvMultipleRow rows = 3;
}

message GetMedianEVToEbitdaFromScyllaRequest {}

message GetMedianEVToEbitdaFromScyllaResponse {
  bool success = 1;
  string message = 2;
  repeated MedianEvMultipleRow rows = 3;
}
