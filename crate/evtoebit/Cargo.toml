[package]
name = "evtoebit"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
futures = "0.3"
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
scylla = "1.5"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tonic = "0.12"
prost = "0.13"
user = { path = "../user" }
stock_list = { path = "../stock_list" }
dotenvy = "0.15"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"
