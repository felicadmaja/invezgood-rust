syntax = "proto3";

package gcs;

service Gcs {
  // Signed POST GCS — path `{module}/...` (`gcs_new_object_path`).
  // Klien (Flutter/web) upload langsung setelah dapat link.
  rpc GetStorageUrl(GetStorageUrlRequest) returns (GetStorageUrlResponse);

  // Hapus object GCS (HTTP DELETE dengan OAuth service account).
  rpc GcsDeleteObject(GcsDeleteObjectRequest) returns (GcsDeleteObjectResponse);

  // Signed GET pratinjau object. Cache in-process per `object_path` selama **7 hari**
  // (`GCS_PREVIEW_URL_EXPIRES_SECS=604800`). Bila signed URL di cache sudah lewat
  // `expires_at_unix`, di-sign ulang (GCS V4 max 7 hari per URL).
  rpc GeneratePreviewUrl(GeneratePreviewUrlRequest) returns (GeneratePreviewUrlResponse);
}

message GetStorageUrlRequest {
  string file_extension = 1;
  // Prefix modul path object, mis. `stoksaham` — selaras `gcs_new_object_path`.
  string module = 2;
}

message GetStorageUrlResponse {
  string post_url = 1;
  string object_path = 2;
  string content_type = 3;
  int64 expires_at_unix = 4;
  int64 max_file_size_bytes = 5;
  map<string, string> post_form_fields = 6;
}

message GcsDeleteObjectRequest {
  // Path object GCS (relatif `{module}/...` atau `gs://{bucket}/{module}/...`).
  string path = 1;
}

message GcsDeleteObjectResponse {
  bool success = 1;
  string message = 2;
}

message GeneratePreviewUrlRequest {
  string object_path = 1;
}

message GeneratePreviewUrlResponse {
  string get_url = 1;
  int64 expires_at_unix = 2;
}
