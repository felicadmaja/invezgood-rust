syntax = "proto3";

package chart;

service Chart {
  // Memerlukan user login. Kirim metadata: authorization: Bearer <token>.
  // GET api.invezgo.com/analysis/intraday-data/{code}?market=RG (Bearer INVEZGO_BEARER_TOKEN).
  // Jam operasional (waktu server lokal): 
  // - Senin–Kamis 09:00–12:00 & 13:30–16:00;
  // - Jumat 09:00–11:30 & 14:00–16:00 — hit API live.
  // Setelah 16:00 (Senin–Jumat): baca cache EOD (Moka→Redis); bila miss hit API 1x lalu simpan.
  // Setelah 09:15: bila volume API = 0, code di-cache sebagai libur (untuk EOD setelah 16:00).
  // Jam live tetap GET Invezgo (tidak di-skip cache libur) agar OHLC ter-log.
  // Debug log: GetCurrentDayChartFromInvezgo {user} {ms}ms - {code} O= H= L= C=
  rpc GetCurrentDayChartFromInvezgo(GetCurrentDayChartFromInvezgoRequest)
      returns (GetCurrentDayChartFromInvezgoResponse);

  // Memerlukan user login. Kirim metadata: authorization: Bearer <token>.
  // Cache 2 lapis (Moka → Redis → Invezgo API). Key: code + from_date + to_date.
  // GET Invezgo analysis/chart/stock/{code}?from=&to= bila cache miss.
  rpc GetHistoryChartFromInvezgo(GetHistoryChartFromInvezgoRequest)
      returns (GetHistoryChartFromInvezgoResponse);
}

message GetCurrentDayChartFromInvezgoRequest {
  string code = 1;
}

message GetCurrentDayChartFromInvezgoResponse {
  string code = 1;
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  double avg = 6;
  int64 volume = 7;
  int64 freq = 8;
  int64 value = 9;
  double prev = 10;
  double bid_price = 11;
  int64 bid_lot = 12;
  int64 bid_freq = 13;
  double offer_price = 14;
  int64 offer_lot = 15;
  int64 offer_freq = 16;
  double iep = 17;
  int64 iev = 18;
  bool success = 19;
  string message = 20;
}

message GetHistoryChartFromInvezgoRequest {
  string code = 1;
  string from_date = 2;
  string to_date = 3;
}

message ChartBar {
  string date = 1;
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  string volume = 6;
}

message GetHistoryChartFromInvezgoResponse {
  repeated ChartBar items = 1;
  bool success = 2;
  string message = 3;
}
