syntax = "proto3";

package chart;

service Chart {
  // Memerlukan user login valid. Tanpa auth / session invalid: response default (tidak GET Invezgo).
  // Kirim metadata: authorization: Bearer <token>.
  // GET api.invezgo.com/analysis/intraday-data/{code}?market=RG (Bearer INVEZGO_BEARER_TOKEN).
  // Jam operasional (waktu server lokal):
  // - Senin–Kamis 09:00–12:00 & 13:30–16:00;
  // - Jumat 09:00–11:30 & 14:00–16:00 — GET Invezgo live; snapshot disimpan ke cache Moka+Redis.
  // Diluar jam operasional (istirahat, setelah 16:00), Sabtu/Minggu, dan tanggal invezgood.hari_libur:
  // baca cache Moka→Redis; miss → GET Invezgo 1x lalu simpan; request ulang kirim dari cache.
  // Bila diakses jam 00:00 - 09:00 pada hari senin - jumat dan bukan hari libur berikan no result dengan pesan error "Market belum buka."
  // Response intraday: bila open=0 → open=close; bila low=0 dan high=0 → low=high=close (sebelum return/cache).
  // Debug log: GetCurrentDayChartFromInvezgo {user} {ms}ms - {code} O= H= L= C=
  rpc GetCurrentDayChartFromInvezgo(GetCurrentDayChartFromInvezgoRequest)
      returns (GetCurrentDayChartFromInvezgoResponse);

  // Memerlukan user login valid. Tanpa auth / session invalid: response default (tidak GET Invezgo).
  // Kirim metadata: authorization: Bearer <token>.
  // Cache 2 lapis (Moka → Redis → Invezgo API). Key: code + from_date + to_date.
  // GET Invezgo analysis/chart/stock/{code}?from=&to= bila cache miss.
  rpc GetHistoryChartFromInvezgo(GetHistoryChartFromInvezgoRequest)
      returns (GetHistoryChartFromInvezgoResponse);

  // Memerlukan user login valid. Tanpa auth / session invalid: response default (tidak GET Invezgo).
  // Cache 2 lapis (Moka → Redis → Invezgo API). Key: COMPOSITE + from_date + to_date.
  // GET api.invezgo.com/analysis/chart/index/COMPOSITE?from={from_date}&to={to_date} bila cache miss.
  // Response: array bar OHLCV IHSG (COMPOSITE), field volume string dari API.
  rpc GetHistoryIHSGFromInvezgo(GetHistoryIHSGFromInvezgoRequest)
      returns (GetHistoryIHSGFromInvezgoResponse);
}

message GetCurrentDayChartFromInvezgoRequest {
  string code = 1;
}

message GetCurrentDayChartFromInvezgoResponse {
  string code = 1;
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  double avg = 6;
  int64 volume = 7;
  int64 freq = 8;
  int64 value = 9;
  double prev = 10;
  double bid_price = 11;
  int64 bid_lot = 12;
  int64 bid_freq = 13;
  double offer_price = 14;
  int64 offer_lot = 15;
  int64 offer_freq = 16;
  double iep = 17;
  int64 iev = 18;
  bool success = 19;
  string message = 20;
}

message GetHistoryChartFromInvezgoRequest {
  string code = 1;
  string from_date = 2;
  string to_date = 3;
}

message ChartBar {
  string date = 1;
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  string volume = 6;
}

message GetHistoryChartFromInvezgoResponse {
  repeated ChartBar items = 1;
  bool success = 2;
  string message = 3;
}

message GetHistoryIHSGFromInvezgoRequest {
  string from_date = 1;
  string to_date = 2;
}

message GetHistoryIHSGFromInvezgoResponse {
  repeated ChartBar items = 1;
  bool success = 2;
  string message = 3;
}
