syntax = "proto3";

package bandarmology;

service Bandarmology {
  // Lookup baris bandarmology via PK (hanya baca Scylla, tidak scrape):
  // agg_tahun_bulan_emiten_name = tahun_bulan + '_' + kode_emiten
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetBandarmologyFromScylla(GetBandarmologyFromScyllaRequest) returns (GetBandarmologyFromScyllaResponse);

  // Lookup banyak emiten untuk satu `tahun_bulan` (hanya baca Scylla, tidak scrape).
  // Per kode: PK `tahun_bulan + '_' + kode_emiten` (sama GetBandarmologyFromScylla).
  // kode_emiten dinormalisasi UPPERCASE; duplikat di-skip; kode invalid diabaikan.
  // Response hanya baris yang ada di Scylla (yang tidak ketemu tidak ikut).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetMultiBandarmologyFromScylla(GetMultiBandarmologyFromScyllaRequest)
      returns (GetMultiBandarmologyFromScyllaResponse);

  // Scrape bandarmology harian via API Stockbit → upsert `bandarmology_harian`.
  // Per tanggal di `tahun_bulan_tanggal` (YYYY-MM-DD): API from=to=tanggal itu, symbol=emiten_name.
  // Sebelum scrape: cek Scylla PK (emiten_name, tahun_bulan_tanggal); bila sudah ada → skip tanggal itu.
  // Tanggal hari ini (server lokal) selalu di-skip scrape (belum final / kosong dari API).
  // emiten_name: tepat 4 huruf; dinormalisasi UPPERCASE. Tanggal duplikat di-skip; format invalid diabaikan.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetBandarmologyHarianFromStockbit(GetBandarmologyHarianFromStockbitRequest)
      returns (GetBandarmologyHarianFromStockbitResponse);
}

message GetBandarmologyFromScyllaRequest {
  // Wajib format YYYY-MM (contoh "2026-07"); selain itu invalid_argument.
  string tahun_bulan = 1;
  // Kode emiten / ticker (4 huruf); di server di-capitalize ke uppercase (bbca → BBCA).
  string kode_emiten = 2;
}

message GetBandarmologyFromScyllaResponse {
  BandarmologyRow row = 1;
}

message GetMultiBandarmologyFromScyllaRequest {
  // Wajib format YYYY-MM (contoh "2026-07"); selain itu invalid_argument.
  string tahun_bulan = 1;
  // Daftar kode emiten (4 huruf); dinormalisasi UPPERCASE; duplikat di-skip.
  repeated string kode_emiten = 2;
}

message GetMultiBandarmologyFromScyllaResponse {
  repeated BandarmologyRow rows = 1;
}

message GetBandarmologyHarianFromStockbitRequest {
  // Kode emiten / ticker: tepat 4 huruf; dinormalisasi UPPERCASE (bbca → BBCA).
  string emiten_name = 1;
  // Daftar tanggal YYYY-MM-DD; duplikat di-skip; format invalid diabaikan.
  repeated string tahun_bulan_tanggal = 2;
}

message GetBandarmologyHarianFromStockbitResponse {
  repeated BandarmologyHarianRow rows = 1;
  bool success = 2;
  string message = 3;
}

message BandarmologyHarianRow {
  string emiten_name = 1;
  // YYYY-MM-DD
  string tahun_bulan_tanggal = 2;
  BandarmologyDay broker_summary_harian = 3;
  string updated_at = 4;
}

message BandarmologyRow {
  string agg_tahun_bulan_emiten_name = 1;
  string emiten_name = 2;
  string tahun_bulan = 3;
  BandarmologyDay broker_summary = 4;
  // Minggu berjalan (bulan saat ini / tgl 1 = w4 bulan lalu):
  // w1=1–7, w2=8–14, w3=15–21, w4=22–kemarin (bulan berjalan) / 22–akhir (bulan sudah lewat)
  BandarmologyDay broker_summary_current_w1 = 5;
  BandarmologyDay broker_summary_current_w2 = 6;
  BandarmologyDay broker_summary_current_w3 = 7;
  BandarmologyDay broker_summary_current_w4 = 8;
  string updated_at = 9;
}

message BandarmologyDay {
  BandarmologyTopStats top_1 = 1;
  BandarmologyTopStats top_3 = 2;
  BandarmologyTopStats top_5 = 3;
  BandarmologyTopStats average = 4;
  int64 net_volume = 5;
  string net_value = 6;
  int64 average_rp = 7;
  repeated BandarmologyBrokerBuy broker_buy = 8;
  repeated BandarmologyBrokerSell broker_sell = 9;
}


message BandarmologyTopStats {
  int64 volume = 1;
  double percent = 2;
  int64 rp_b = 3;
  string acc_dist = 4;
}

message BandarmologyBrokerBuy {
  string broker_code = 1;
  string buy_volume = 2;
  string buy_lot = 3;
  int64 buy_avg = 4;
}

message BandarmologyBrokerSell {
  string broker_code = 1;
  string sell_volume = 2;
  string sell_lot = 3;
  int64 sell_avg = 4;
}



