syntax = "proto3";

package bandarmology;

service Bandarmology {
  // Memerlukan user login. Kirim metadata: authorization: Bearer <token> (token dari user.Login).
  // Tanpa token valid → unauthenticated.
  // Tanggal hari ini (waktu lokal) di-skip: tidak GET Invezgo, tidak di-stream.
  // Tanggal lain: cek Scylla — baris sudah ada (termasuk bandarmology kosong dari GET Invezgo []) → cache.
  // Bila belum ada baris: GET api.invezgo.com/analysis/summary/stock/{code}?from={date}&to={date}&investor=all&market=RG
  // (from = to, data harian) → upsert Scylla (list boleh kosong). Bearer INVEZGO_BEARER_TOKEN.
  // Stream: push satu GetBandarmologyByCodeResponse (1 BandarmologyRow) per tanggal (kecuali hari ini), urutan sama dengan request.
  rpc GetBandarmologyByCode(GetBandarmologyByCodeRequest) returns (stream GetBandarmologyByCodeResponse);
}

message GetBandarmologyByCodeRequest {
  string code = 1;
  repeated string tahun_bulan_tanggal = 2;
}

message GetBandarmologyByCodeResponse {
  BandarmologyRow item = 1;
}

message BandarmologyEntry {
  string code = 1;
  string buy_freq = 2;
  string buy_volume = 3;
  string buy_value = 4;
  string sell_freq = 5;
  string sell_volume = 6;
  string sell_value = 7;
  optional double buy_avg = 8;
  optional double sell_avg = 9;
  string net_value = 10;
  string net_volume = 11;
  string net_freq = 12;
  string name = 13;
}

message BandarmologyRow {
  string code = 1;
  string tahun_bulan_tanggal = 2;
  repeated BandarmologyEntry bandarmology = 3;
  string updated_at = 4;
}
