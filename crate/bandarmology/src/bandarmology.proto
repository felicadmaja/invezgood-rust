syntax = "proto3";

package bandarmology;

service Bandarmology {
  // Lookup baris bandarmology via PK (hanya baca Scylla, tidak scrape):
  // agg_tahun_bulan_emiten_name = tahun_bulan + '_' + kode_emiten
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetBandarmologyFromScylla(GetBandarmologyFromScyllaRequest) returns (GetBandarmologyFromScyllaResponse);

  // Scrape bandarmology 1 tahun kebelakang (max 12 bulan) untuk satu emiten via API Stockbit.
  // Aturan sama `bandarmology_worker`:
  // - bulan berjalan overwrite `broker_summary` (awal bulan → hari ini) hanya bila
  //   `updated_at` kosong / bukan hari ini; jika `updated_at` masih hari ini → skip fetch summary;
  // - kolom minggu: scrape minggu aktif (slot tanggal) + backfill w1..wN bila kolom masih kosong;
  //   tgl 2–8 → w1; tgl 9–15 → w2; tgl 16–22 → w3; tgl 23–akhir & tgl 1 → w4;
  // - historis di-skip seluruhnya bila baris **bulan lalu** sudah ada di Scylla; bila tidak,
  //   skip per bulan bila sudah ada; henti bila 1 bulan sudah ada atau 1 bulan kosong dari API;
  // Response.row = baris bulan berjalan setelah scrape (termasuk w1–w4 bila ada).
  // kode_emiten: tepat 4 huruf; dinormalisasi ke UPPERCASE.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetBandarmologyFromStockbit(GetBandarmologyFromStockbitRequest) returns (GetBandarmologyFromStockbitResponse);
}

message GetBandarmologyFromScyllaRequest {
  // Wajib format YYYY-MM (contoh "2026-07"); selain itu invalid_argument.---
  string tahun_bulan = 1;
  // Kode emiten / ticker (4 huruf); di server di-capitalize ke uppercase (bbca → BBCA).
  string kode_emiten = 2;
}


message GetBandarmologyFromScyllaResponse {
  BandarmologyRow row = 1;
}

message GetBandarmologyFromStockbitRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  string kode_emiten = 1;
}

message GetBandarmologyFromStockbitResponse {
  bool success = 1;
  string message = 2;
  // Baris bulan berjalan setelah scrape (broker_summary + w1–w4); kosong jika gagal / belum ada.
  BandarmologyRow row = 3;
}
message BandarmologyRow {
  string agg_tahun_bulan_emiten_name = 1;
  string emiten_name = 2;
  string tahun_bulan = 3;
  BandarmologyDay broker_summary = 4;
  // Minggu berjalan (bulan saat ini / tgl 1 = w4 bulan lalu):
  // w1=1–7, w2=8–14, w3=15–21, w4=22–akhir bulan — diisi sesuai slot tanggal invoke (lihat RPC).
  BandarmologyDay broker_summary_current_w1 = 5;
  BandarmologyDay broker_summary_current_w2 = 6;
  BandarmologyDay broker_summary_current_w3 = 7;
  BandarmologyDay broker_summary_current_w4 = 8;
  string updated_at = 9;
}

message BandarmologyDay {
  BandarmologyTopStats top_1 = 1;
  BandarmologyTopStats top_3 = 2;
  BandarmologyTopStats top_5 = 3;
  BandarmologyTopStats average = 4;
  int64 net_volume = 5;
  string net_value = 6;
  int64 average_rp = 7;
  repeated BandarmologyBrokerBuy broker_buy = 8;
  repeated BandarmologyBrokerSell broker_sell = 9;
}


message BandarmologyTopStats {
  int64 volume = 1;
  double percent = 2;
  int64 rp_b = 3;
  string acc_dist = 4;
}

message BandarmologyBrokerBuy {
  string broker_code = 1;
  string buy_volume = 2;
  string buy_lot = 3;
  int64 buy_avg = 4;
}

message BandarmologyBrokerSell {
  string broker_code = 1;
  string sell_volume = 2;
  string sell_lot = 3;
  int64 sell_avg = 4;
}



