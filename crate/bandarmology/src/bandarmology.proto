syntax = "proto3";

package bandarmology;

service Bandarmology {
  // Scrape bandarmology harian via API Stockbit → upsert `bandarmology_harian`.
  // Per tanggal di `tahun_bulan_tanggal` (YYYY-MM-DD): API from=to=tanggal itu, symbol=emiten_name.
  // Sebelum scrape: cek Scylla PK (emiten_name, tahun_bulan_tanggal); bila sudah ada → skip tanggal itu.
  // Tanggal hari ini (server lokal) selalu di-skip scrape (belum final / kosong dari API).
  // emiten_name: tepat 4 huruf; dinormalisasi UPPERCASE. Tanggal duplikat di-skip; format invalid diabaikan.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetBandarmologyHarianFromStockbit(GetBandarmologyHarianFromStockbitRequest)
      returns (GetBandarmologyHarianFromStockbitResponse);

  // Baca `bandarmology_harian` dari Scylla (tidak scrape) untuk satu emiten + daftar tanggal.
  // Per tanggal: PK `(emiten_name, tahun_bulan_tanggal)`; yang tidak ketemu di-skip.
  // emiten_name: tepat 4 huruf; dinormalisasi UPPERCASE.
  // tahun_bulan_tanggal: YYYY-MM-DD; duplikat di-skip; format invalid diabaikan.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetBrokerAccDist(GetBrokerAccDistRequest) returns (GetBrokerAccDistResponse);
}

message GetBrokerAccDistRequest {
  // Kode emiten / ticker: tepat 4 huruf; dinormalisasi UPPERCASE (bbca → BBCA).
  string emiten_name = 1;
  // Daftar tanggal YYYY-MM-DD; duplikat di-skip; format invalid diabaikan.
  repeated string tahun_bulan_tanggal = 2;
}

message GetBrokerAccDistResponse {
  repeated BandarmologyHarianRow broker_acc_dist = 1;
}

message GetBandarmologyHarianFromStockbitRequest {
  // Kode emiten / ticker: tepat 4 huruf; dinormalisasi UPPERCASE (bbca → BBCA).
  string emiten_name = 1;
  // Daftar tanggal YYYY-MM-DD; duplikat di-skip; format invalid diabaikan.
  repeated string tahun_bulan_tanggal = 2;
}

message GetBandarmologyHarianFromStockbitResponse {
  repeated BandarmologyHarianRow rows = 1;
  bool success = 2;
  string message = 3;
}

message BandarmologyHarianRow {
  string emiten_name = 1;
  // YYYY-MM-DD
  string tahun_bulan_tanggal = 2;
  BandarmologyDay broker_summary_harian = 3;
  string updated_at = 4;
}

message BandarmologyDay {
  BandarmologyTopStats top_1 = 1;
  BandarmologyTopStats top_3 = 2;
  BandarmologyTopStats top_5 = 3;
  BandarmologyTopStats average = 4;
  int64 net_volume = 5;
  string net_value = 6;
  int64 average_rp = 7;
  repeated BandarmologyBrokerBuy broker_buy = 8;
  repeated BandarmologyBrokerSell broker_sell = 9;
}

message BandarmologyTopStats {
  int64 volume = 1;
  double percent = 2;
  int64 rp_b = 3;
  string acc_dist = 4;
}

message BandarmologyBrokerBuy {
  string broker_code = 1;
  string buy_volume = 2;
  string buy_lot = 3;
  int64 buy_avg = 4;
}

message BandarmologyBrokerSell {
  string broker_code = 1;
  string sell_volume = 2;
  string sell_lot = 3;
  int64 sell_avg = 4;
}
