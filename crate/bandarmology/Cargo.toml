[package]
name = "bandarmology"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scylla = { version = "1.5", features = ["chrono-04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt"] }
tokio-stream = "0.1"
tonic = "0.12"
prost = "0.13"
user = { path = "../user" }
grpc_stream = { path = "../grpc_stream" }
invezgo_http = { path = "../invezgo_http" }

[build-dependencies]
tonic-build = "0.12"
