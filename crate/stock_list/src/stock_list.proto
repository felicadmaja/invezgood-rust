syntax = "proto3";

package stock_list;

service StockList {
  // Cek Redis StockListUpdatedAt: kosong atau >30 hari → GET Invezgo + upsert Scylla + set timestamp.
  // Masih valid (<30 hari) → baca Scylla saja. Response: daftar saham.
  rpc GetAllStocks(GetAllStocksRequest) returns (GetAllStocksResponse);

  // statement=KEYSTATS → GET /analysis/keystat/{code}?type=Q → upsert keystats + keystats_updated_at.
  // statement=BS|IS|CF → GET /analysis/financial-statement/{code}?statement={BS|IS|CF}&type=Q&limit=8
  //   → upsert balance_statement | income_statement | cash_flow + *_updated_at masing-masing.
  // Baca Scylla by PK code; refresh API bila *_updated_at kosong atau >30 hari. Bearer INVEZGO_BEARER_TOKEN.
  // Request: code wajib, statement wajib (KEYSTATS|BS|IS|CF). Response: FinancialStatementResponse.
  rpc GetFinancialStatement(GetFinancialStatementRequest) returns (FinancialStatementResponse);

  // GET api.invezgo.com/analysis/shareholder-detail/{code} → upsert share_holder_5 + share_holder_5_updated_at.
  // Baca Scylla by PK code; refresh API bila share_holder_5_updated_at kosong atau >30 hari. Bearer INVEZGO_BEARER_TOKEN.
  // Response: ShareHolder5Row. code wajib; kosong → InvalidArgument.
  rpc GetShareHolder5(GetShareHolder5Request) returns (ShareHolder5Row);

  // GET api.invezgo.com/analysis/shareholder-detail-one?code={code} → upsert share_holder_1 + share_holder_1_updated_at.
  // Baca Scylla by PK code; refresh API bila share_holder_1_updated_at kosong atau >30 hari. Bearer INVEZGO_BEARER_TOKEN.
  // Response: ShareHolder1Row. code wajib; kosong → InvalidArgument.
  rpc GetShareHolder1(GetShareHolder1Request) returns (ShareHolder1Row);
}

message GetAllStocksRequest {}

message GetFinancialStatementRequest {
  string code = 1;
  // KEYSTATS | BS | IS | CF
  string statement = 2;
}

message GetShareHolder5Request {
  string code = 1;
}

message GetShareHolder1Request {
  string code = 1;
}

message KeyStatsValue {
  string col = 1;
  int32 year = 2;
  double amount = 3;
  string period = 4;
}

message KeyStatsRowItem {
  string id = 1;
  string name = 2;
  repeated KeyStatsValue values = 3;
}

message KeyStatsColumn {
  int32 year = 1;
  string label = 2;
  string period = 3;
}

message FinancialStatementResponse {
  string code = 1;
  string statement = 2;
  repeated KeyStatsRowItem keystats_rows = 3;
  repeated FinancialStatementRowItem rows = 4;
  repeated KeyStatsColumn columns = 5;
  optional int64 updated_at = 6; // Unix seconds UTC
}

message FinancialStatementRowItem {
  string id = 1;
  string name = 2;
  int32 level = 3;
  repeated KeyStatsValue values = 4;
  optional string parent_id = 5;
  bool is_abstract = 6;
  int32 display_order = 7;
}

message ShareHolder5Entry {
  string code = 1;
  string name = 2;
  int64 date = 3; // Unix seconds UTC
  string val = 4;
  double percent = 5;
}

message ShareHolder5Row {
  string code = 1;
  repeated ShareHolder5Entry items = 2;
  optional int64 share_holder_5_updated_at = 3; // Unix seconds UTC
}

message ShareHolder1Entry {
  string code = 1;
  string name = 2;
  string type = 3;
  string status = 4;
  string nationality = 5;
  string domicile = 6;
  string scripless = 7;
  string scrip = 8;
  string total = 9;
  double percentage = 10;
}

message ShareHolder1Row {
  string code = 1;
  repeated ShareHolder1Entry items = 2;
  optional int64 share_holder_1_updated_at = 3; // Unix seconds UTC
}

message StockListRow {
  string code = 1;
  string name = 2;
  string sector = 3;
  string logo = 4;
  optional int64 keystats_updated_at = 5; // Unix seconds UTC
}

message GetAllStocksResponse {
  bool success = 1;
  string message = 2;
  repeated StockListRow items = 3;
}
