syntax = "proto3";

package stock_list;

service StockList {
  // Semua RPC memerlukan user login. Kirim metadata: authorization: Bearer <token> (token dari user.Login).
  //
  // Cek Redis StockListUpdatedAt: kosong atau >30 hari → GET Invezgo + upsert Scylla + set timestamp.
  // Masih valid (<30 hari) → baca Scylla saja. Response: daftar saham.
  rpc GetAllStocks(GetAllStocksRequest) returns (GetAllStocksResponse);

  // Baca Scylla by PK code. Request: code wajib. Response: StockByCodeResponse.
  rpc GetStockByCode(GetStockByCodeRequest) returns (StockByCodeResponse);

  // GET Invezgo per jenis → upsert keystats, balance_statement, income_statement, cash_flow + *_updated_at.
  // Baca Scylla by PK code; refresh API per kolom bila *_updated_at kosong atau >30 hari. Bearer INVEZGO_BEARER_TOKEN.
  // Request: code wajib. Response: FinancialStatementResponse (keystats, balance_statement, income_statement, cash_flow).
  rpc GetFinancialStatementByCode(GetFinancialStatementByCodeRequest) returns (FinancialStatementResponse);

  // Baca Scylla token-ring scan kolom keystats — tanpa GET Invezgo.
  // Request kosong. Response: repeated KeystatsResponse per code.
  rpc GetAllKeyStats(GetAllKeyStatsRequest) returns (GetAllKeyStatsResponse);

  // GET Invezgo → upsert share_holder_5/1/composition + company_information + *_updated_at.
  // Baca Scylla by PK code; refresh API per kolom bila *_updated_at kosong atau >30 hari. Bearer INVEZGO_BEARER_TOKEN.
  // Request: code wajib. Response: ShareHolderAndCompanyInformationByCodeResponse.
  rpc GetShareHolderAndCompanyInformationByCode(GetShareHolderAndCompanyInformationByCodeRequest) returns (ShareHolderAndCompanyInformationByCodeResponse);

  // GET api.invezgo.com/analysis/calendar?code={code} → upsert corporate_action + corporate_action_updated_at.
  // Baca Scylla by PK code; refresh API bila corporate_action_updated_at kosong atau >30 hari. Bearer INVEZGO_BEARER_TOKEN.
  // Request: code wajib. Response: CorporateActionByCodeResponse.
  rpc GetCorporateActionByCode(GetCorporateActionByCodeRequest) returns (CorporateActionByCodeResponse);

  // Update kolom is_konglomerasi di Scylla by PK code.
  rpc UpdateIsKonglomerasi(UpdateIsKonglomerasiRequest) returns (UpdateIsKonglomerasiResponse);

  // Update kolom is_plan_to_trade di Scylla by PK code.
  rpc UpdateIsPlanToTrade(UpdateIsPlanToTradeRequest) returns (UpdateIsPlanToTradeResponse);

  // Update kolom catatan_owner di Scylla by PK code.
  rpc UpdateCatatanOwner(UpdateCatatanOwnerRequest) returns (UpdateCatatanOwnerResponse);

  // Update kolom catatan_pribadi di Scylla by PK code.
  rpc UpdateCatatanPribadi(UpdateCatatanPribadiRequest) returns (UpdateCatatanPribadiResponse);

  // Baca kolom wyckoff_chart di Scylla by PK code. Request: code wajib. Response: GetWyckoffChartByCodeResponse.
  rpc GetWyckoffChartByCode(GetWyckoffChartByCodeRequest) returns (GetWyckoffChartByCodeResponse);

  // Update kolom wyckoff_chart di Scylla by PK code. Request: code + wyckoff_chart. Response: success + message.
  rpc UpdateWyckoffChartByCode(UpdateWyckoffChartByCodeRequest) returns (UpdateWyckoffChartByCodeResponse);

  // Update kolom horizontal_line di Scylla by PK code. Request: code + horizontal_line. Response: success + message.
  rpc UpdateHorizontalLineByCode(UpdateHorizontalLineByCodeRequest)
      returns (UpdateHorizontalLineByCodeResponse);

  // Baca kolom horizontal_line di Scylla by PK code. Request: code wajib. Response: code + horizontal_line.
  rpc GetHorizontalLineByCode(GetHorizontalLineByCodeRequest) returns (GetHorizontalLineByCodeResponse);
}

message GetAllStocksRequest {}

message GetStockByCodeRequest {
  string code = 1;
}

message StockByCodeResponse {
  string code = 1;
  string name = 2;
  string sector = 3;
  string logo = 4;
  KeystatsData keystats = 5;
  StatementPanelData balance_statement = 6;
  StatementPanelData income_statement = 7;
  StatementPanelData cash_flow = 8;
  ShareHolder5Data share_holder_5 = 9;
  ShareHolder1Data share_holder_1 = 10;
  ShareHolderCompositionData share_holder_composition = 11;
  CompanyInformationData company_information = 12;
  CorporateActionData corporate_action = 13;
  string catatan_owner = 14;
  string catatan_pribadi = 15;
  bool is_plan_to_trade = 16;
  bool is_konglomerasi = 17;
  WyckoffChartData wyckoff_chart = 18;
  repeated int32 horizontal_line = 19;
}

message WyckoffChartData {
  repeated int32 accumulation_trading_range = 1;
  repeated int32 distribution_trading_range = 2;
  repeated string sc = 3;
  repeated string ar = 4;
  repeated string st = 5;
  repeated string ps = 6;
  repeated string spr = 7;
  repeated string ut = 8;
  repeated string sos = 9;
  repeated string lps = 10;
  repeated string buec = 11;
  repeated string mup = 12;
  repeated string psy = 13;
  repeated string bc = 14;
  repeated string utad = 15;
  repeated string sow = 16;
  repeated string lpsy = 17;
  repeated string mdw = 18;
}

message GetFinancialStatementByCodeRequest {
  string code = 1;
}

message GetAllKeyStatsRequest {}

message GetAllKeyStatsResponse {
  repeated KeystatsResponse items = 1;
}

message GetShareHolderAndCompanyInformationByCodeRequest {
  string code = 1;
}

message GetCorporateActionByCodeRequest {
  string code = 1;
}

message GetWyckoffChartByCodeRequest {
  string code = 1;
}

message GetWyckoffChartByCodeResponse {
  string code = 1;
  WyckoffChartData wyckoff_chart = 2;
}

message UpdateWyckoffChartByCodeRequest {
  string code = 1;
  WyckoffChartData wyckoff_chart = 2;
}

message UpdateWyckoffChartByCodeResponse {
  bool success = 1;
  string message = 2;
}

message GetHorizontalLineByCodeRequest {
  string code = 1;
}

message GetHorizontalLineByCodeResponse {
  string code = 1;
  repeated int32 horizontal_line = 2;
}

message UpdateHorizontalLineByCodeRequest {
  string code = 1;
  repeated int32 horizontal_line = 2;
}

message UpdateHorizontalLineByCodeResponse {
  bool success = 1;
  string message = 2;
}

message UpdateIsKonglomerasiRequest {
  string code = 1;
  bool is_konglomerasi = 2;
}

message UpdateIsKonglomerasiResponse {
  string code = 1;
  bool is_konglomerasi = 2;
}

message UpdateIsPlanToTradeRequest {
  string code = 1;
  bool is_plan_to_trade = 2;
}

message UpdateIsPlanToTradeResponse {
  string code = 1;
  bool is_plan_to_trade = 2;
}

message UpdateCatatanOwnerRequest {
  string code = 1;
  string catatan_owner = 2;
}

message UpdateCatatanOwnerResponse {
  string code = 1;
  string catatan_owner = 2;
}

message UpdateCatatanPribadiRequest {
  string code = 1;
  string catatan_pribadi = 2;
}

message UpdateCatatanPribadiResponse {
  string code = 1;
  string catatan_pribadi = 2;
}

message KeyStatsValue {
  string col = 1;
  int32 year = 2;
  double amount = 3;
  string period = 4;
}

message KeyStatsRowItem {
  string id = 1;
  string name = 2;
  repeated KeyStatsValue values = 3;
}

message KeyStatsColumn {
  int32 year = 1;
  string label = 2;
  string period = 3;
}

message KeystatsData {
  repeated KeyStatsRowItem rows = 1;
  repeated KeyStatsColumn columns = 2;
  optional int64 updated_at = 3; // Unix seconds UTC
}

message StatementPanelData {
  repeated FinancialStatementRowItem rows = 1;
  repeated KeyStatsColumn columns = 2;
  optional int64 updated_at = 3; // Unix seconds UTC
}

message FinancialStatementResponse {
  string code = 1;
  KeystatsData keystats = 2;
  StatementPanelData balance_statement = 3;
  StatementPanelData income_statement = 4;
  StatementPanelData cash_flow = 5;
}

message KeystatsResponse {
  string code = 1;
  KeystatsData keystats = 2;
}

message FinancialStatementRowItem {
  string id = 1;
  string name = 2;
  int32 level = 3;
  repeated KeyStatsValue values = 4;
  optional string parent_id = 5;
  bool is_abstract = 6;
  int32 display_order = 7;
}

message ShareHolder5Entry {
  string code = 1;
  string name = 2;
  int64 date = 3; // Unix seconds UTC
  string val = 4;
  double percent = 5;
}

message ShareHolder5Data {
  repeated ShareHolder5Entry items = 1;
  optional int64 updated_at = 2; // Unix seconds UTC
}

message ShareHolder1Data {
  repeated ShareHolder1Entry items = 1;
  optional int64 updated_at = 2; // Unix seconds UTC
}

message ShareHolderCompositionData {
  repeated ShareHolderCompositionEntry items = 1;
  optional int64 updated_at = 2; // Unix seconds UTC
}

message ShareHolderAndCompanyInformationByCodeResponse {
  string code = 1;
  ShareHolder5Data share_holder_5 = 2;
  ShareHolder1Data share_holder_1 = 3;
  ShareHolderCompositionData share_holder_composition = 4;
  CompanyInformationData company_information = 5;
}

message ShareHolder1Entry {
  string code = 1;
  string name = 2;
  string type = 3;
  string status = 4;
  string nationality = 5;
  string domicile = 6;
  string scripless = 7;
  string scrip = 8;
  string total = 9;
  double percentage = 10;
}

message ShareHolderCompositionEntry {
  string code = 1;
  string name = 2;
  double percentage = 3;
  string badge = 4;
}

message CompanyPersonEntry {
  string name = 1;
  string position = 2;
}

message CompanySubsidiaryEntry {
  string name = 1;
  double percentage = 2;
}

message CompanyInformationData {
  string address = 1;
  string industry = 2;
  string subsindustry = 3;
  string activity = 4;
  string name = 5;
  string npwp = 6;
  string board = 7;
  string sector = 8;
  string subsector = 9;
  optional int64 listing_date = 10; // Unix seconds UTC
  string website = 11;
  string logo = 12;
  optional string additional_info = 13;
  optional string people = 14;
  optional string report_type = 15;
  optional string administration = 16;
  optional string description = 17;
  optional double ipo_pct = 18;
  optional double ipo_price = 19;
  optional string ipo_share = 20;
  optional string ipo_underwriter = 21;
  optional double nominal_price = 22;
  repeated string category = 23;
  bool active = 24;
  repeated CompanyPersonEntry commissioner = 25;
  repeated CompanyPersonEntry director = 26;
  repeated CompanySubsidiaryEntry subsidiary = 27;
  optional int64 updated_at = 28; // Unix seconds UTC
}

message CorporateActionEntry {
  string code = 1;
  string type = 2;
  map<string, string> payload = 3;
}

message CorporateActionData {
  int32 total_page = 1;
  int32 page = 2;
  optional int32 next_page = 3;
  repeated CorporateActionEntry data = 4;
  optional int64 updated_at = 5; // Unix seconds UTC
}

message CorporateActionByCodeResponse {
  string code = 1;
  CorporateActionData corporate_action = 2;
}

message StockListRow {
  string code = 1;
  string name = 2;
  string sector = 3;
  string logo = 4;
  optional int64 keystats_updated_at = 5; // Unix seconds UTC
  string catatan_owner = 6;
  string catatan_pribadi = 7;
  bool is_plan_to_trade = 8;
  bool is_konglomerasi = 9;
}

message GetAllStocksResponse {
  bool success = 1;
  string message = 2;
  repeated StockListRow items = 3;
}
