syntax = "proto3";

package stock_list;

service StockList {
  // Cek Redis StockListUpdatedAt: kosong atau >30 hari → GET Invezgo + upsert Scylla + set timestamp.
  // Masih valid (<30 hari) → baca Scylla saja. Response: daftar saham.
  rpc GetAllStocks(GetAllStocksRequest) returns (GetAllStocksResponse);

  // GET Invezgo per jenis → upsert keystats, balance_statement, income_statement, cash_flow + *_updated_at.
  // Baca Scylla by PK code; refresh API per kolom bila *_updated_at kosong atau >30 hari. Bearer INVEZGO_BEARER_TOKEN.
  // Request: code wajib. Response: FinancialStatementResponse (keystats, balance_statement, income_statement, cash_flow).
  rpc GetFinancialStatementByCode(GetFinancialStatementByCodeRequest) returns (FinancialStatementResponse);

  // GET Invezgo per jenis → upsert share_holder_5, share_holder_1, share_holder_composition + *_updated_at.
  // Baca Scylla by PK code; refresh API per kolom bila *_updated_at kosong atau >30 hari. Bearer INVEZGO_BEARER_TOKEN.
  // Request: code wajib. Response: ShareHolderByCodeResponse.
  rpc GetShareHolderByCode(GetShareHolderByCodeRequest) returns (ShareHolderByCodeResponse);

  // GET api.invezgo.com/analysis/information/{code} → upsert company_information + company_information_updated_at.
  // Baca Scylla by PK code; refresh API bila company_information_updated_at kosong atau >30 hari. Bearer INVEZGO_BEARER_TOKEN.
  // Request: code wajib. Response: CompanyInformationByCodeResponse.
  rpc GetCompanyInformationByCode(GetCompanyInformationByCodeRequest) returns (CompanyInformationByCodeResponse);
}

message GetAllStocksRequest {}

message GetFinancialStatementByCodeRequest {
  string code = 1;
}

message GetShareHolderByCodeRequest {
  string code = 1;
}

message GetCompanyInformationByCodeRequest {
  string code = 1;
}

message KeyStatsValue {
  string col = 1;
  int32 year = 2;
  double amount = 3;
  string period = 4;
}

message KeyStatsRowItem {
  string id = 1;
  string name = 2;
  repeated KeyStatsValue values = 3;
}

message KeyStatsColumn {
  int32 year = 1;
  string label = 2;
  string period = 3;
}

message KeystatsData {
  repeated KeyStatsRowItem rows = 1;
  repeated KeyStatsColumn columns = 2;
  optional int64 updated_at = 3; // Unix seconds UTC
}

message StatementPanelData {
  repeated FinancialStatementRowItem rows = 1;
  repeated KeyStatsColumn columns = 2;
  optional int64 updated_at = 3; // Unix seconds UTC
}

message FinancialStatementResponse {
  string code = 1;
  KeystatsData keystats = 2;
  StatementPanelData balance_statement = 3;
  StatementPanelData income_statement = 4;
  StatementPanelData cash_flow = 5;
}

message FinancialStatementRowItem {
  string id = 1;
  string name = 2;
  int32 level = 3;
  repeated KeyStatsValue values = 4;
  optional string parent_id = 5;
  bool is_abstract = 6;
  int32 display_order = 7;
}

message ShareHolder5Entry {
  string code = 1;
  string name = 2;
  int64 date = 3; // Unix seconds UTC
  string val = 4;
  double percent = 5;
}

message ShareHolder5Data {
  repeated ShareHolder5Entry items = 1;
  optional int64 updated_at = 2; // Unix seconds UTC
}

message ShareHolder1Data {
  repeated ShareHolder1Entry items = 1;
  optional int64 updated_at = 2; // Unix seconds UTC
}

message ShareHolderCompositionData {
  repeated ShareHolderCompositionEntry items = 1;
  optional int64 updated_at = 2; // Unix seconds UTC
}

message ShareHolderByCodeResponse {
  string code = 1;
  ShareHolder5Data share_holder_5 = 2;
  ShareHolder1Data share_holder_1 = 3;
  ShareHolderCompositionData share_holder_composition = 4;
}

message ShareHolder1Entry {
  string code = 1;
  string name = 2;
  string type = 3;
  string status = 4;
  string nationality = 5;
  string domicile = 6;
  string scripless = 7;
  string scrip = 8;
  string total = 9;
  double percentage = 10;
}

message ShareHolderCompositionEntry {
  string code = 1;
  string name = 2;
  double percentage = 3;
  string badge = 4;
}

message CompanyPersonEntry {
  string name = 1;
  string position = 2;
}

message CompanySubsidiaryEntry {
  string name = 1;
  double percentage = 2;
}

message CompanyInformationData {
  string address = 1;
  string industry = 2;
  string subsindustry = 3;
  string activity = 4;
  string name = 5;
  string npwp = 6;
  string board = 7;
  string sector = 8;
  string subsector = 9;
  optional int64 listing_date = 10; // Unix seconds UTC
  string website = 11;
  string logo = 12;
  optional string additional_info = 13;
  optional string people = 14;
  optional string report_type = 15;
  optional string administration = 16;
  optional string description = 17;
  optional double ipo_pct = 18;
  optional double ipo_price = 19;
  optional string ipo_share = 20;
  optional string ipo_underwriter = 21;
  optional double nominal_price = 22;
  repeated string category = 23;
  bool active = 24;
  repeated CompanyPersonEntry commissioner = 25;
  repeated CompanyPersonEntry director = 26;
  repeated CompanySubsidiaryEntry subsidiary = 27;
  optional int64 updated_at = 28; // Unix seconds UTC
}

message CompanyInformationByCodeResponse {
  string code = 1;
  CompanyInformationData company_information = 2;
}

message StockListRow {
  string code = 1;
  string name = 2;
  string sector = 3;
  string logo = 4;
  optional int64 keystats_updated_at = 5; // Unix seconds UTC
}

message GetAllStocksResponse {
  bool success = 1;
  string message = 2;
  repeated StockListRow items = 3;
}
