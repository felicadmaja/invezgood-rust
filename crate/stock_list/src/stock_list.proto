syntax = "proto3";

package stock_list;

service StockList {
  // Semua RPC memerlukan user login. Kirim metadata: authorization: Bearer <token> (token dari user.Login).
  //
  // Cek Redis StockListUpdatedAt: kosong atau >30 hari → GET Invezgo + upsert Scylla + set timestamp.
  // Masih valid (<30 hari) → baca Scylla saja. Response di-cache Moka in-memory TTL 1 menit
  // (key global, semua user); hit → skip Redis/Scylla/Invezgo. Response: daftar saham.
  rpc GetAllStocks(GetAllStocksRequest) returns (GetAllStocksResponse);

  // Baca Scylla by PK code. Request: code wajib. Response: StockByCodeResponse.
  rpc GetStockByCode(GetStockByCodeRequest) returns (StockByCodeResponse);

  // Stream: push GetStockByRepeatedCodeResponse per code (Scylla only, tanpa GET Invezgo).
  // Code kosong di-skip; code tidak ketemu diabaikan. Urutan mengikuti request.
  rpc GetStockByRepeatedCode(GetStockByRepeatedCodeRequest)
      returns (stream GetStockByRepeatedCodeResponse);

  // Stream: push KeyStatsFromStockbitResponse per bagian (stats, closure group, fin year group, dividend).
  // GET Stockbit API bila kolom kosong atau *_updated_at >30 hari. Rate limit 1× / 5 detik saat GET API.
  rpc GetKeyStatsFromStockbit(GetKeyStatsFromStockbitRequest)
      returns (stream KeyStatsFromStockbitResponse);

  // Stream: push StockbitProfileResponse (meta + tiap item repeated) per code.
  // GET Stockbit API bila stockbit_profile kosong atau stockbit_profile_updated_at ≥ 30 hari.
  rpc GetStockbitProfileByCode(GetStockbitProfileByCodeRequest)
      returns (stream StockbitProfileResponse);

  // Stream: push StockbitReportsRow (meta + tiap stream report) per code.
  // GET Stockbit API bila stockbit_reports_updated_at ≥ 7 hari atau kosong.
  rpc GetStockbitReportsByCode(GetStockbitReportsByCodeRequest)
      returns (stream StockbitReportsRow);

  // GET Invezgo per jenis → upsert keystats, balance_statement, income_statement, cash_flow + *_updated_at.
  // Baca Scylla by PK code; refresh API per kolom bila *_updated_at kosong atau >30 hari. Bearer INVEZGO_BEARER_TOKEN.
  // Request: code wajib. Response: FinancialStatementResponse (keystats, balance_statement, income_statement, cash_flow).
  rpc GetFinancialStatementByCode(GetFinancialStatementByCodeRequest) returns (FinancialStatementResponse);

  // Stream: push GetAllKeyStatsResponse per code (Scylla only, tanpa GET Invezgo).
  // Urutan code ASC. Request kosong.
  rpc GetAllKeyStats(GetAllKeyStatsRequest) returns (stream GetAllKeyStatsResponse);

  // GET Invezgo → upsert share_holder_5/1/composition + company_information + *_updated_at.
  // Baca Scylla by PK code; refresh API per kolom bila *_updated_at kosong atau >30 hari. Bearer INVEZGO_BEARER_TOKEN.
  // Request: code wajib. Response: ShareHolderAndCompanyInformationByCodeResponse.
  rpc GetShareHolderAndCompanyInformationByCode(GetShareHolderAndCompanyInformationByCodeRequest) returns (ShareHolderAndCompanyInformationByCodeResponse);

  // GET api.invezgo.com/analysis/calendar?code={code} → upsert corporate_action + corporate_action_updated_at.
  // Baca Scylla by PK code; refresh API bila corporate_action_updated_at kosong atau >30 hari. Bearer INVEZGO_BEARER_TOKEN.
  // Request: code wajib. Response: CorporateActionByCodeResponse.
  rpc GetCorporateActionByCode(GetCorporateActionByCodeRequest) returns (CorporateActionByCodeResponse);


  // Update kolom sub_sector di Scylla by PK code. Request: code + sub_sector.
  // Side effect: tulis invezgood.stock_list. Response: success + message; not_found bila code tidak ada.
  rpc UpdateSubSector(UpdateSubSectorRequest) returns (UpdateSubSectorResponse);

  // Update kolom is_konglomerasi di Scylla by PK code.
  rpc UpdateIsKonglomerasi(UpdateIsKonglomerasiRequest) returns (UpdateIsKonglomerasiResponse);

  // Update kolom is_plan_to_trade di Scylla by PK code.
  rpc UpdateIsPlanToTrade(UpdateIsPlanToTradeRequest) returns (UpdateIsPlanToTradeResponse);

  // Update kolom catatan_owner di Scylla by PK code.
  rpc UpdateCatatanOwner(UpdateCatatanOwnerRequest) returns (UpdateCatatanOwnerResponse);

  // Update kolom catatan_pribadi di Scylla by PK code.
  rpc UpdateCatatanPribadi(UpdateCatatanPribadiRequest) returns (UpdateCatatanPribadiResponse);

  // Baca kolom wyckoff_chart di Scylla by PK code. Request: code wajib. Response: GetWyckoffChartByCodeResponse.
  rpc GetWyckoffChartByCode(GetWyckoffChartByCodeRequest) returns (GetWyckoffChartByCodeResponse);

  // Update kolom wyckoff_chart di Scylla by PK code. Request: code + wyckoff_chart. Response: success + message.
  rpc UpdateWyckoffChartByCode(UpdateWyckoffChartByCodeRequest) returns (UpdateWyckoffChartByCodeResponse);

  // Update kolom horizontal_line di Scylla by PK code. Request: code + horizontal_line. Response: success + message.
  rpc UpdateHorizontalLineByCode(UpdateHorizontalLineByCodeRequest)
      returns (UpdateHorizontalLineByCodeResponse);

  // Baca kolom horizontal_line di Scylla by PK code. Request: code wajib. Response: code + horizontal_line.
  rpc GetHorizontalLineByCode(GetHorizontalLineByCodeRequest) returns (GetHorizontalLineByCodeResponse);

  // Butuh login: metadata authorization: Bearer <token> (dari user.Login).
  // Read-only: baca kolom takeprofit_wyckoff dari invezgood.stock_list by PK code. Tidak GET API eksternal.
  // Request: code wajib. code tidak ada → not_found. Kolom null/kosong → success + map kosong.
  rpc GetTakeProfitWyckoffByCode(GetTakeProfitWyckoffByCodeRequest)
      returns (GetTakeProfitWyckoffByCodeResponse);

  // Butuh login: metadata authorization: Bearer <token> (dari user.Login).
  // Upsert kolom takeprofit_wyckoff (map<text,double>) di invezgood.stock_list by PK code.
  // Request: code wajib + map take-profit Wyckoff (key=fase/label, value=harga). Map kosong = hapus isi map.
  // Cek code ada dulu; tidak ada → not_found. Side effect: tulis Scylla saja (read-only tidak GET API).
  rpc UpsertTakeProfitWyckoffByCode(UpsertTakeProfitWyckoffByCodeRequest)
      returns (UpsertTakeProfitWyckoffByCodeResponse);

  // Butuh login: metadata authorization: Bearer <token> (dari user.Login).
  // Hapus nilai kolom takeprofit_wyckoff (SET null) di invezgood.stock_list by PK code; baris stock tetap ada.
  // Request: code wajib. Cek code ada dulu; tidak ada → not_found. Tidak GET API eksternal.
  rpc DeleteTakeProfitWyckoffByCode(DeleteTakeProfitWyckoffByCodeRequest)
      returns (DeleteTakeProfitWyckoffByCodeResponse);

  // Update kolom is_bad_fundamental di invezgood.stock_list by PK code.
  // Wajib Bearer login. success=false + message bila code tidak ada atau DB gagal.
  rpc UpdateIsBadFundamentalByCode(UpdateIsBadFundamentalByCodeRequest)
      returns (UpdateIsBadFundamentalByCodeResponse);

  // GET api.invezgo.com/analysis/notation → upsert kolom notation (list UDT) per code di invezgood.stock_list.
  // Bearer dari INVEZGO_BEARER_TOKEN. Request kosong. Code tidak ada di DB → dilewati (skipped_count).
  // Response: success + pesan jumlah updated/skipped.
  rpc UpdateNotationInvezgo(UpdateNotationInvezgoRequest) returns (UpdateNotationInvezgoResponse);
}

