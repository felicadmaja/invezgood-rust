[package]
name = "stock_list"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
futures = "0.3"
moka = { version = "0.12", features = ["future"] }
redis = { version = "0.27", features = ["tokio-comp"] }
invezgo_http = { path = "../invezgo_http" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scylla = { version = "1.5", features = ["chrono-04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stockbit_browser = { path = "../stockbit_browser" }
tokio = { version = "1", features = ["sync", "macros", "rt", "rt-multi-thread", "time"] }
tokio-stream = "0.1"
tonic = "0.12"
prost = "0.13"
user = { path = "../user" }
grpc_stream = { path = "../grpc_stream" }
dotenvy = "0.15"

[build-dependencies]
tonic-build = "0.12"
