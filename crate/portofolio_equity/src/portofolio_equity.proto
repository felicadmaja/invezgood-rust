syntax = "proto3";

package portofolio_equity;

service PortofolioEquity {
  // Baca semua baris dari tabel Scylla `portofolio_equity`.
  // Request kosong. Response: repeated PortofolioEquityRow.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  // Scrape Stockbit/upsert equity dilakukan oleh `Portofolio.GetAllPortofolioFromStockbit`
  // (satu GET `portfolio/v2/list` untuk holdings + summary).
  rpc GetAllPortofolioEquityFromScylla(GetAllPortofolioEquityFromScyllaRequest)
      returns (GetAllPortofolioEquityFromScyllaResponse);
}

message GetAllPortofolioEquityFromScyllaRequest {}

message PortofolioEquityRow {
  string nama = 1;
  double value = 2;
}

message GetAllPortofolioEquityFromScyllaResponse {
  repeated PortofolioEquityRow rows = 1;
}
