syntax = "proto3";

package portofolio_equity;

service PortofolioEquity {
  // Baca semua baris dari tabel Scylla `portofolio_equity`.
  // Request kosong. Response: repeated PortofolioEquityRow.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetAllPortofolioEquityFromScylla(GetAllPortofolioEquityFromScyllaRequest)
      returns (GetAllPortofolioEquityFromScyllaResponse);

  // Scrape equity dari GET carina.stockbit.com/portfolio/v2/list (`data.summary`)
  // lalu upsert `portofolio_equity` — alur sama `portofolio_worker::scrape_and_insert_portofolio_equity`
  // (login → START TRADING/PIN bila perlu → Bearer trading → GET API → insert).
  // Mapping: Trading Balance, Invested, Open (allocated), Net Profit Loss, Total Equity.
  // Rate limit: maksimal 1× per 5 menit untuk semua user
  // (failed precondition jika terlalu cepat). Juga terpakai oleh auto IsStockbitReady.
  // Hanya hari operasional Senin–Jumat dan jam server 09:00–12:00 serta 13:30–16:00
  // (failed precondition: "Diluar hari operasional Senin-Jumat..." atau
  // "Diluar jam 09:00-12:00 dan 13:30-16:00").
  // Request kosong. Response: repeated PortofolioEquityRow (isi setelah scrape).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetAllPortofolioEquityFromStockbit(GetAllPortofolioEquityFromStockbitRequest)
      returns (GetAllPortofolioEquityFromStockbitResponse);
}

message GetAllPortofolioEquityFromScyllaRequest {}

message GetAllPortofolioEquityFromStockbitRequest {}

message PortofolioEquityRow {
  string nama = 1;
  double value = 2;
}

message GetAllPortofolioEquityFromScyllaResponse {
  repeated PortofolioEquityRow rows = 1;
}

message GetAllPortofolioEquityFromStockbitResponse {
  bool success = 1;
  string message = 2;
  repeated PortofolioEquityRow rows = 3;
}
