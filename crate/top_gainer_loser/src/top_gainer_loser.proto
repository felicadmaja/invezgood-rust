syntax = "proto3";

package top_gainer_loser;

service TopGainerLoser {
  // Stream subscribe: tahun_bulan_tanggal kosong/hari ini → poll Invezgo tiap 15 menit (hanya bila ada subscriber) → upsert Scylla → push ke client.
  // Tanggal bukan hari ini → satu batch dari Scylla lalu stream selesai. gain→tipe=gain, loss→tipe=loser.
  rpc GetTopGainerLoser(GetTopGainerLoserRequest) returns (stream GetTopGainerLoserResponse);
}

message GetTopGainerLoserRequest {
  optional string tahun_bulan_tanggal = 1;
}

message GetTopGainerLoserResponse {
  repeated TopGainerLoserRow items = 1;
}

message GraphPoint {
  string date = 1;
  double value = 2;
}

message TopGainerLoserRow {
  string tahun_bulan_tanggal = 1;
  string code = 2;
  string name = 3;
  double price = 4;
  double change = 5;
  string value = 6;
  string volume = 7;
  string logo = 8;
  double calculated_value = 9;
  string tipe = 10;
  repeated GraphPoint graph = 11;
}
