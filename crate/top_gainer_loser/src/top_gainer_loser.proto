syntax = "proto3";

package top_gainer_loser;

service TopGainerLoser {
  // Memerlukan user login. Kirim metadata: authorization: Bearer <token> (token dari user.Login).
  // Baca Scylla by tahun_bulan_tanggal (kosong = hari ini).
  // Hari ini: hanya Scylla — tidak GET Invezgo (API biasanya kosong, hemat jatah). Stream 1 pesan lalu selesai.
  // Tanggal lampau: bila Scylla kosong → GET Invezgo + upsert Scylla lalu return. Stream selesai.
  // gain→tipe=gain, loss→tipe=loser.
  rpc GetTopGainerLoser(GetTopGainerLoserRequest) returns (stream GetTopGainerLoserResponse);
}

message GetTopGainerLoserRequest {
  optional string tahun_bulan_tanggal = 1;
}

message GetTopGainerLoserResponse {
  repeated TopGainerLoserRow items = 1;
  bool success = 2;
  string message = 3;
}

message GraphPoint {
  string date = 1;
  double value = 2;
}

message TopGainerLoserRow {
  string tahun_bulan_tanggal = 1;
  string code = 2;
  string name = 3;
  double price = 4;
  double change = 5;
  string value = 6;
  string volume = 7;
  string logo = 8;
  double calculated_value = 9;
  string tipe = 10;
  repeated GraphPoint graph = 11;
}
