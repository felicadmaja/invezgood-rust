syntax = "proto3";

package user;

service User {
  // Cek email+password (bcrypt) di invezgood.user; bila valid buat session token in-memory (256-bit CSPRNG, 64 hex).
  // Response: token, nama, role, email, expires_at (Unix detik, sesi 12 jam). Error via gRPC status.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Hapus session token dari store in-memory; idempotent bila token tidak ada.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Token ring scan invezgood.user; baca semua baris user, read-only.
  rpc GetUsersFromScylla(GetUsersFromScyllaRequest) returns (GetUsersFromScyllaResponse);

  // Status login Chrome scraper Stockbit (state di Redis stockbit:readiness).
  // Poller global 9–10 menit selalu jalan sejak server start (tanpa perlu subscriber stream).
  // Banyak subscriber stream tidak menambah frekuensi poll.
  // Setelah tiap tick (bila ready + jam operasional Senin–Kamis 09:00–12:00 & 13:30–16:00;
  // Jumat 09:00–11:30 & 14:00–16:00), poller auto-invoke alur scrape berikut
  // (bukan panggil gRPC client, langsung scrape worker):
  //   Mulai 09:15: GET Yahoo Finance v8 chart BBCA.JK (1d, hanya hari ini
  //   period1=00:00 lokal period2=sekarang) — bila volume titik terakhir = 0,
  //   hari itu dianggap market libur; poller TIDAK menjalankan:
  //     1. GetAllPortofolioFromStockbit
  //     2. GetLatestEmitenTrendingFromStockbit
  //     3. GetAllPendingOrderFromStockbit
  //     4. Yahoo Finance spike (emiten dari invezgood.stock_list_by_is_plan_to_trade = true)
  //   Hasil cek di-cache Redis key `invezgood:yahoo:market_holiday:{YYYY-MM-DD}` (value `1`=libur, `0`=buka; TTL s/d 23:59:59 lokal).
  //   Bila market buka (volume > 0), paralel:
  //     • Yahoo Finance spike (baca code dari invezgood.stock_list_by_is_plan_to_trade
  //       WHERE is_plan_to_trade = true → chart .JK 1d,
  //       hanya hari ini period1=00:00 lokal period2=sekarang; jeda 25ms antar emiten).
  //       UP bila close naik >= 12% vs open; DOWN bila close turun >= 6% vs open
  //       → response.portofolio. HTTP 409: log merah, jeda 300ms, retry GET.
  //       Emiten sudah di-output hari ini di-cache Redis key `invezgood:yahoo_atr:spike_reported`
  //       (TTL s/d 23:59:59 lokal) — tidak dicek Yahoo lagi sampai ganti hari.
  //     • Serial (satu Chrome): GetAllPortofolioFromStockbit → GetLatestEmitenTrendingFromStockbit → GetAllPendingOrderFromStockbit
  // Subscribe stream: server push saat status/portofolio berubah + heartbeat ~30s.
  // Wajib authorization: Bearer <token>. success=true bila sesi Stockbit sudah login/ready.
  rpc IsStockbitReady(IsStockbitReadyRequest) returns (stream IsStockbitReadyResponse);


  // GET api.invezgo.com/usage/api → jatah pemakaian API Invezgo (Bearer INVEZGO_BEARER_TOKEN).
  // Wajib authorization: Bearer <token> login. Request kosong. Response: UsageResponse.
  // Error: unauthenticated / internal (token env kosong, HTTP non-2xx, parse gagal).
  rpc CekUsage(CekUsageRequest) returns (UsageResponse);
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  string nama = 2;
  string role = 3;
  string email = 4;
  int64 expires_at = 5;
}

message LogoutRequest {
  string token = 1;
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}

message GetUsersFromScyllaRequest {}

message UserRow {
  string email = 1;
  string nama = 2;
  string role = 3;
}

message GetUsersFromScyllaResponse {
  repeated UserRow items = 1;
}

message IsStockbitReadyRequest {}

message StockbitPortofolioSingkatRow {
  string emiten_name = 1;
  // "up" bila close naik >= 12% vs open hari ini; "down" bila close turun >= 6% vs open.
  string jenis_spike = 2;
  // Persentase perubahan close vs open (mis. 8.5% -> naik, -12.3% -> turun).
  double value_spike_percentage = 3;
}

message IsStockbitReadyResponse {
  bool success = 1;
  string message = 2;
  // Emiten is_plan_to_trade=true dengan spike baru hari ini (close naik >= 12% atau turun >= 6% vs open);
  // yang sudah di-output hari ini tidak diulang (Redis cache s/d akhir hari).
  repeated StockbitPortofolioSingkatRow portofolio = 3;
}

message CekUsageRequest {}

message UsageResponse {
  int64 usage = 1;
  int64 remaining = 2;
  int64 limit = 3;
  bool is_blocked = 4;
  string expire = 5;
}
