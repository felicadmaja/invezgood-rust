syntax = "proto3";

package user;

service User {
  // Cek email+password (bcrypt) di invezgood.user; bila valid terbit JWT HS256 (JWT_SECRET).
  // Sesi aktif di-track in-memory by jti; masa berlaku JWT_EXPIRY_SECS (.env, default 30 hari).
  // Response: token (JWT), nama, role, email, expires_at (Unix detik). Error via gRPC status.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Revoke JWT: hapus jti dari store in-memory sehingga token tidak valid meski belum expired; idempotent bila sudah logout.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Baca invezgood.user read-only. Bearer login wajib.
  // role admin: token ring scan semua user; selain admin: hanya baris email login sendiri.
  rpc GetUsersFromScylla(GetUsersFromScyllaRequest) returns (GetUsersFromScyllaResponse);

  // INSERT invezgood.user (email PK); password default '12345678' di-hash bcrypt sebelum simpan.
  // Gagal bila email sudah ada. Bearer login wajib; hanya role admin (permission_denied selain admin).
  rpc InsertUser(InsertUserRequest) returns (MutateUserResponse);

  // UPDATE nama + role by email (PK); password tidak diubah. Gagal bila email tidak ditemukan.
  // Bearer login wajib; hanya role admin.
  rpc UpdateUser(UpdateUserRequest) returns (MutateUserResponse);

  // DELETE by email (PK). success=true idempotent bila baris sudah tidak ada.
  // Bearer login wajib; hanya role admin.
  rpc DeleteUser(DeleteUserRequest) returns (MutateUserResponse);

  // Status login Chrome scraper Stockbit (state di Redis stockbit:readiness).
  // Poller global selalu jalan sejak server start (tanpa perlu subscriber stream).
  // Cek pertama: Senin–Jumat 09:00:00–09:00:59 waktu server; seterusnya interval 30–60 menit
  // (STOCKBIT_READY_POLL_MIN_SECS / STOCKBIT_READY_POLL_MAX_SECS, .env).
  // Banyak subscriber stream tidak menambah frekuensi poll.
  // Setelah tiap tick (bila ready + jam operasional Senin–Kamis 09:00–12:00 & 13:30–16:00; Jumat 09:00–11:30 & 14:00–16:00), Sabtu/Minggu dan tanggal yang ada di Scylla invezgood.hari_libur selalu libur 
  // poller auto-invoke alur scrape berikut (serial Chrome, satu browser):
  //     1. GetAllPortofolioFromStockbit
  //     2. GetLatestEmitenTrendingFromStockbit
  //     3. GetAllPendingOrderFromStockbit
  // Subscribe stream: server push saat status berubah + heartbeat ~30s.
  // Wajib Bearer login valid. Tanpa auth / session invalid: push 1x is_need_login=true lalu UNAUTHENTICATED, stream ditutup.
  // success=true bila sesi Stockbit sudah login/ready.
  rpc IsStockbitReady(IsStockbitReadyRequest) returns (stream IsStockbitReadyResponse);

  // Stream spike Yahoo. Poller hanya jalan bila ada ≥1 client subscribe (0 subscriber → idle, tidak hit Yahoo).
  // Cek pertama tiap hari Senin–Jumat 09:00:00–09:00:59 waktu server;
  // seterusnya interval INTERVAL_YAHOO_SPIKE_POLL_SECS (.env, detik; default 120) di jam kerja
  // Senin–Kamis 09:00–12:00 & 13:30–16:00; Jumat 09:00–11:30 & 14:00–16:00.
  // Sabtu/Minggu dan tanggal yang ada di Scylla invezgood.hari_libur selalu libur — poller TIDAK dijalankan.
  // 09:00:00–09:05:59 waktu lokal: spike = (close hari ini - close candle sebelumnya) / close candle
  // sebelumnya * 100 (chart 1d lookback 7 hari); ambang OPENING_UP_SPIKE_PERCENTAGE /
  // OPENING_DOWN_SPIKE_PERCENTAGE (.env). Di luar jam itu: spike = (close - open) / open * 100
  // hari ini; ambang UP_SPIKE_PERCENTAGE / DOWN_SPIKE_PERCENTAGE (.env).
  // Tiap tick (bila market buka): fetch_yahoo_price_spikes untuk code invezgood.stock_list_by_is_plan_to_trade WHERE is_plan_to_trade = true.
  // Jeda JEDA_MS_ANTAR_EMITEN (.env, ms).
  // HTTP 409: log merah, jeda 300ms, retry.
  // Setelah GET Yahoo: spike baru di-upsert Redis JSON
  // `invezgood:yahoo_atr:spike_today:{YYYY-MM-DD}` — tiap item: spike_at, emiten_name,
  // jenis_spike (up/down), value_spike_percentage. TTL s/d 23:59:59 lokal;
  // ganti hari → key baru (cache lama invalid). SET `...spike_reported:{YYYY-MM-DD}`
  // untuk skip GET Yahoo emiten yang sudah di-cache hari itu.
  // Stream ke client selalu isi cache Redis (bukan hanya hasil tick Yahoo terbaru).
  // Wajib Bearer login valid. Tanpa auth / session invalid: push 1x is_need_login=true lalu UNAUTHENTICATED (tidak subscribe poller Yahoo).
  // Subscribe: push saat data berubah + heartbeat ~30s. Banyak subscriber tidak menambah frekuensi poll.
  rpc GetPriceSpikeFromYahooFinance(GetPriceSpikeFromYahooFinanceRequest) returns (stream PriceSpikeResponse);

  // DINONAKTIFKAN SEMENTARA: handler tidak mengaktifkan poller Invezgo spike; untuk client yang
  // terautentikasi hanya push 1x response kosong (success=true, data kosong) lalu tutup stream.
  // Auth tetap diperiksa: tanpa auth / session invalid → push 1x is_need_login=true lalu UNAUTHENTICATED.
  // (Perilaku asli: stream spike Invezgo berbasis poller — cek Senin–Jumat 09:00 lalu interval
  //  INTERVAL_INVEZGO_SPIKE_POLL_SECS; emiten dari invezgood.portofolio; cache Redis per mode.)
  rpc GetPriceSpikeFromInvezGo(GetPriceSpikeFromInvezGoRequest) returns (stream PriceSpikeResponse);


  // GET api.invezgo.com/usage/api → jatah pemakaian API Invezgo (Bearer INVEZGO_BEARER_TOKEN).
  // Wajib authorization: Bearer <token> login. Request kosong. Response: UsageResponse.
  // Error: unauthenticated / internal (token env kosong, HTTP non-2xx, parse gagal).
  rpc CekUsage(CekUsageRequest) returns (UsageResponse);
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  string nama = 2;
  string role = 3;
  string email = 4;
  int64 expires_at = 5;
}

message LogoutRequest {
  string token = 1;
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}

message GetUsersFromScyllaRequest {}

message UserRow {
  string email = 1;
  string nama = 2;
  string role = 3;
}

message GetUsersFromScyllaResponse {
  repeated UserRow items = 1;
}

message InsertUserRequest {
  string email = 1;
  string nama = 2;
  string role = 3;
}

message UpdateUserRequest {
  string email = 1;
  string nama = 2;
  string role = 3;
}

message DeleteUserRequest {
  string email = 1;
}

message MutateUserResponse {
  bool success = 1;
  string message = 2;
}

message IsStockbitReadyRequest {}

message StockbitPortofolioSingkatRow {
  string emiten_name = 1;
  // "up" bila close naik >= UP_SPIKE_PERCENTAGE (.env) vs open; "down" bila turun >= DOWN_SPIKE_PERCENTAGE (.env).
  string jenis_spike = 2;
  // Persentase perubahan close vs open (mis. 8.5% -> naik, -12.3% -> turun).
  double value_spike_percentage = 3;
}

message IsStockbitReadyResponse {
  bool success = 1;
  string message = 2;
  // Tidak diisi (spike Yahoo hanya di stream GetPriceSpikeFromYahooFinance).
  repeated StockbitPortofolioSingkatRow portofolio = 3;
  // true bila request anonymous (tanpa auth / session invalid).
  bool is_need_login = 4;
}

message GetPriceSpikeFromYahooFinanceRequest {}

message GetPriceSpikeFromInvezGoRequest {}

message PriceSpikeRow {
  string emiten_name = 1;
  // "up" / "down" dari ambang .env. 09:00–09:05: OPENING_UP/DOWN_SPIKE_PERCENTAGE,
  // (close_hari_ini - close_candle_sebelumnya) / close_candle_sebelumnya * 100; selain itu UP/DOWN_SPIKE_PERCENTAGE,
  // (close - open) / open * 100 hari ini.
  string jenis_spike = 2;
  // Persentase (naik positif, turun negatif). 09:00–09:05: vs close candle sebelumnya; selain itu vs open hari ini.
  double value_spike_percentage = 3;
  // Waktu lokal deteksi spike (YYYY-MM-DD HH:MM:SS), dari Redis cache.
  string spike_at = 4;
}

message PriceSpikeResponse {
  bool success = 1;
  string message = 2;
  repeated PriceSpikeRow data = 3;
  // true bila request anonymous (tanpa auth / session invalid).
  bool is_need_login = 4;
}

message CekUsageRequest {}

message UsageResponse {
  int64 usage = 1;
  int64 remaining = 2;
  int64 limit = 3;
  bool is_blocked = 4;
  string expire = 5;
}
