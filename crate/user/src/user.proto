syntax = "proto3";

package user;

service User {
  // Login dengan email + password; cocokkan ke tabel Scylla `user`.
  // Mengembalikan JWT access_token untuk dipakai crate/service lain
  // (header: Authorization: Bearer <token>).
  rpc Login(LoginRequest) returns (LoginResponse);

  // Status kesiapan sesi Stockbit dari background poller (cek web acak tiap 2–5 menit).
  // Client cukup subscribe 1x — stream tetap terbuka; server push saat status berubah
  // (dan heartbeat berkala). RPC tidak hit stockbit.com langsung.
  // Jika poller mendeteksi sesi habis: login ulang otomatis; bila gagal, retry
  // dengan jeda acak 10–30 detik sampai berhasil.
  rpc IsStockbitReady(IsStockbitReadyRequest) returns (stream IsStockbitReadyResponse);


}

message IsStockbitReadyRequest {}

message IsStockbitReadyResponse {
  bool ready = 1; // true/false
  string message = 2; // status: "not authenticated", "authenticated"
}

message LoginRequest {
  string email = 1; // dinormalisasi ke lowercase di server
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  int64 expires_in = 2;
  string user_id = 3;
  string name = 4;
  string email = 5; // selalu lowercase
}
