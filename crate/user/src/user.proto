syntax = "proto3";

package user;

service User {
  // Cek email+password (bcrypt) di invezgood.user; bila valid buat session token in-memory.
  // Response: token (untuk Logout), nama, role. Error via gRPC status.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Hapus session token dari store in-memory; idempotent bila token tidak ada.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Token ring scan invezgood.user; baca semua baris user, read-only.
  rpc GetUsersFromScylla(GetUsersFromScyllaRequest) returns (GetUsersFromScyllaResponse);
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  string nama = 2;
  string role = 3;
}

message LogoutRequest {
  string token = 1;
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}

message GetUsersFromScyllaRequest {}

message UserRow {
  string email = 1;
  string nama = 2;
  string role = 3;
}

message GetUsersFromScyllaResponse {
  repeated UserRow items = 1;
}
