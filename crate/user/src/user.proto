syntax = "proto3";

package user;

service User {
  // Login dengan email + password; cocokkan ke tabel Scylla `user`.
  // Mengembalikan JWT access_token untuk dipakai crate/service lain
  // (header: Authorization: Bearer <token>).
  rpc Login(LoginRequest) returns (LoginResponse);

  // Status kesiapan sesi Stockbit dari background poller (cek web acak tiap 50–60 menit; setting di .env).
  // State terakhir di Redis key `stockbit:readiness` (bukan memory proses).
  // Client cukup subscribe 1x — stream tetap terbuka; server push saat status berubah
  // (dan heartbeat berkala). RPC tidak hit stockbit.com langsung.
  // Jika poller mendeteksi sesi habis: login ulang otomatis; bila gagal, retry
  // dengan jeda acak 10–30 detik sampai berhasil.
  // Bila status ready: tiap siklus poller (acak 50–60 menit) server auto-invoke berurutan
  // (hari operasional Senin–Jumat; jam 09:00–12:00 dan 13:30–16:00; Sabtu/Minggu tidak scrape;
  // tidak lewat gRPC client). Auto & user RPC memakai **jatah rate limit yang sama** (gate `acquire_*` per alur):
  // - auto sudah jalan → user invoke RPC #1–#5 bisa kena failed_precondition
  // - user sudah invoke RPC #1–#5 → auto skip alur itu (lanjut yang lain)
  // Env NEW_BUILD_LANGSUNG_SCRAPE=false: setelah restart, skip auto-scrape siklus ready pertama
  // (cek web tetap); scrape menunggu interval poller berikutnya.
  // 1. GetAllPortofolioFromStockbit          (1×/5 menit)
  // 2. GetAllPortofolioEquityFromStockbit    (1×/5 menit)
  // 3. GetPortofolioHistoryByEmitenNameFromStockbit (batch holdings; 1×/1 detik)
  // 4. GetAllPendingOrderFromStockbit        (1×/5 menit)
  // 5. GetLatestEmitenTrendingFromStockbit   (1×/5 menit)
  rpc IsStockbitReady(IsStockbitReadyRequest) returns (stream IsStockbitReadyResponse);


}

message IsStockbitReadyRequest {}

message IsStockbitReadyResponse {
  bool ready = 1; // true/false
  string message = 2; // status: "not authenticated", "authenticated"
}

message LoginRequest {
  string email = 1; // dinormalisasi ke lowercase di server
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  int64 expires_in = 2;
  string user_id = 3;
  string name = 4;
  string email = 5; // selalu lowercase
}
