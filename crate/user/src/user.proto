syntax = "proto3";

package user;

service User {
  // Login dengan email + password; cocokkan ke tabel Scylla `user`.
  // Mengembalikan JWT access_token untuk dipakai crate/service lain
  // (header: Authorization: Bearer <token>).
  rpc Login(LoginRequest) returns (LoginResponse);

  // Status kesiapan sesi Stockbit dari **satu background poller global** per proses `stockbit_ws`
  // (cek web acak tiap 9–10 menit; setting di .env).
  // Banyak client subscribe `IsStockbitReady` **tidak** menambah frekuensi cek — tetap satu poller,
  // interval 9–10 menit, tidak peduli jumlah subscriber.
  // State terakhir di Redis key `stockbit:readiness` (bukan memory proses).
  // Client cukup subscribe 1x — stream tetap terbuka; server push saat status berubah
  // (dan heartbeat berkala). Stream hanya baca Redis; **tidak** hit stockbit.com langsung.
  // Jika poller mendeteksi sesi habis: login ulang otomatis; bila gagal, retry
  // dengan jeda acak 10–30 detik sampai berhasil.
  // Bila status ready: tiap siklus poller (acak 9–10 menit) server auto-invoke berurutan
  // (hari operasional Senin–Jumat; jam 08:45–12:15 dan 13:25–16:15; Sabtu/Minggu tidak scrape;
  // tidak lewat gRPC client). Auto & user RPC memakai **jatah rate limit yang sama** (gate `acquire_*` per alur):
  // - auto sudah jalan → user invoke RPC #1–#3 bisa kena failed_precondition
  // - user sudah invoke RPC #1–#3 → auto skip alur itu (lanjut yang lain)
  // Env NEW_BUILD_LANGSUNG_SCRAPE=false: setelah restart, skip auto-scrape siklus ready pertama
  // (cek web tetap); scrape menunggu interval poller berikutnya.
  // 1. GetAllPortofolioFromStockbit          (holdings + equity; 1×/3 menit)
  // 2. GetAllPendingOrderFromStockbit        (1×/3 menit)
  // 3. GetLatestEmitenTrendingFromStockbit   (1×/3 menit)
  // Poller/auto-scrape memakai Chrome lock **background** (yield ke RPC client);
  // sleep/idle poller **tidak** memegang Chrome — client tetap bisa invoke RPC.
  rpc IsStockbitReady(IsStockbitReadyRequest) returns (stream IsStockbitReadyResponse);

  // Ubah password user di Scylla `user` (hash bcrypt).
  // Wajib JWT; `user_id` harus cocok dengan user di token (tidak boleh ubah milik orang lain).
  // `user_id`: 16-byte UUID binary, atau UTF-8 string UUID (dari Login.user_id).
  rpc UpdatePassword(UpdatePasswordRequest) returns (UpdatePasswordResponse);

  // Tambah user baru ke Scylla `user` (password di-hash bcrypt; email dinormalisasi lowercase).
  // Wajib JWT role ADMIN; selain itu PERMISSION_DENIED "Harus admin !".
  // Gagal bila email sudah terpakai.
  rpc AddUser(AddUserRequest) returns (AddUserResponse);

  // Hapus user dari Scylla `user` (MV `user_by_email` ikut ter-update).
  // Wajib JWT role ADMIN; selain itu PERMISSION_DENIED "Harus admin !".
  // `id`: 16-byte UUID binary, atau UTF-8 string UUID.
  // Tidak boleh menghapus akun sendiri (hindari lockout).
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  // List user dari Scylla `user` (tanpa kolom password). Wajib JWT. Request kosong.
  // ADMIN → semua user; selain ADMIN → hanya diri sendiri (dari JWT user_id).
  rpc GetAllUsers(GetAllUsersRequest) returns (GetAllUsersResponse);

  // Ubah `role` user di Scylla `user`.
  // Wajib JWT role ADMIN; selain itu PERMISSION_DENIED "Harus admin !".
  // `user_id`: 16-byte UUID binary, atau UTF-8 string UUID.
  // `role` wajib ADMIN atau VIEWER (UNSPECIFIED ditolak).
  rpc UpdateRoleUser(UpdateRoleUserRequest) returns (UpdateRoleUserResponse);
}

// Role akun di Scylla `user.role` (disimpan text lowercase: "admin" / "viewer").
enum RoleUser {
  ROLE_USER_UNSPECIFIED = 0;
  ROLE_USER_ADMIN = 1;
  ROLE_USER_VIEWER = 2;
}

message IsStockbitReadyRequest {}

message IsStockbitReadyResponse {
  bool ready = 1; // true/false
  string message = 2; // status: "not authenticated", "authenticated"
}

message LoginRequest {
  string email = 1; // dinormalisasi ke lowercase di server
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  int64 expires_in = 2;
  string user_id = 3;
  string name = 4;
  string email = 5; // selalu lowercase
  RoleUser role = 6;
}

message UpdatePasswordRequest {
  bytes user_id = 1;
  string new_password = 2;
}

message UpdatePasswordResponse {
  bool success = 1;
  string message = 2;
}

message AddUserRequest {
  string email = 1;
  string password = 2;
  string name = 3;
  // UNSPECIFIED → default VIEWER.
  RoleUser role = 4;
}

message AddUserResponse {
  bool success = 1;
  string message = 2;
}

message DeleteUserRequest {
  bytes id = 1;
}

message DeleteUserResponse {
  bool success = 1;
  string message = 2;
}

message UpdateRoleUserRequest {
  bytes user_id = 1;
  // Wajib ADMIN (1) atau VIEWER (2).
  RoleUser role = 2;
}

message UpdateRoleUserResponse {
  bool success = 1;
  string message = 2;
}

message GetAllUsersRequest {}

// Tanpa password (hash tidak dikirim ke client).
message UserRow {
  string id = 1;
  string name = 2;
  string email = 3;
  RoleUser role = 4;
}

message GetAllUsersResponse {
  repeated UserRow rows = 1;
}
