[package]
name = "user"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
bcrypt = "0.16"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
jsonwebtoken = "9"
prost = { version = "0.13", features = ["std", "derive"] }
scylla = "1.5"
serde = { version = "1", features = ["derive"] }
stockbit_browser = { path = "../stockbit_browser" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["transport"] }
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"
tonic-build = "0.12"
