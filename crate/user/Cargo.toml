[package]
name = "user"
version = "0.1.0"
edition = "2021"

[dependencies]
futures = "0.3"
scylla = "1.5"
stockbit_browser = { path = "../stockbit_browser" }
worker_scrapping = { path = "../../worker_scrapping" }
grpc_stream = { path = "../grpc_stream" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tonic = "0.12"
prost = "0.13"
bcrypt = "0.16"
chrono = "0.4"
getrandom = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tonic-build = "0.12"
