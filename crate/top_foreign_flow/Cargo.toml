[package]
name = "top_foreign_flow"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scylla = { version = "1.5", features = ["chrono-04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
tonic = "0.12"
prost = "0.13"
market_holiday = { path = "../market_holiday" }
user = { path = "../user" }

[build-dependencies]
tonic-build = "0.12"
