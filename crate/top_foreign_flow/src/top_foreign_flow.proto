syntax = "proto3";

package top_foreign_flow;

service TopForeignFlow {
  // GET api.invezgo.com/analysis/top/foreign?date=...&filter_column=value → upsert ke invezgood.top_foreign_flow.
  // Bearer login wajib (metadata authorization). Request date kosong = hari ini (YYYY-MM-DD).
  // Sabtu/Minggu → failed_precondition "Sabtu/Minggi Libur". Setelah upsert, baca Scylla lalu return.
  rpc GetTopForeignFlow(GetTopForeignFlowRequest) returns (GetTopForeignFlowResponse);
}

message GetTopForeignFlowRequest {
  optional string tahun_bulan_tanggal = 1;
}

message GetTopForeignFlowResponse {
  bool success = 1;
  string message = 2;
  repeated TopForeignFlowRow items = 3;
}

message TopForeignFlowRow {
  string tahun_bulan_tanggal = 1;
  string code = 2;
  string name = 3;
  int32 price = 4;
  double change = 5;
  int64 value = 6;
  int64 volume = 7;
  string accum_or_dist = 8;
}
