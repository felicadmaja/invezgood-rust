syntax = "proto3";

package portofolio_bandarmology;

service PortofolioBandarmology {
  // Baca semua baris `portofolio_bandarmology` untuk satu emiten (PK partition).
  // Urutan clustering: tahun_bulan_tanggal DESC (terbaru dulu).
  // emiten_name: tepat 4 huruf alfabet; dinormalisasi ke UPPERCASE.
  // Tidak ditemukan (0 baris) → NOT_FOUND.
  // Format emiten_name invalid → INVALID_ARGUMENT.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetPortofolioBandarmology(GetPortofolioBandarmologyRequest)
      returns (GetPortofolioBandarmologyResponse);

  // Bersihkan `portofolio_bandarmology` yang sudah tidak terpakai (orphan).
  // Alur:
  // 1. Token-ring scan `portofolio_bandarmology` → kumpulkan distinct `emiten_name`.
  // 2. Untuk tiap emiten_name, cek `portofolio` WHERE emiten_name = ?.
  // 3. Bila baris `portofolio` TIDAK ADA → DELETE semua baris partition
  //    `portofolio_bandarmology` untuk emiten itu
  //    (`DELETE WHERE emiten_name = ?`).
  // Request kosong. Response: success=true, message="success".
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc DeletePortofolioBandarmology(DeletePortofolioBandarmologyRequest)
      returns (DeletePortofolioBandarmologyResponse);
}

message GetPortofolioBandarmologyRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE (bbca → BBCA).
  string emiten_name = 1;
}

message GetPortofolioBandarmologyResponse {
  repeated PortofolioBandarmologyRow rows = 1;
}

message DeletePortofolioBandarmologyRequest {}

message DeletePortofolioBandarmologyResponse {
  bool success = 1;
  string message = 2;
}

message PortofolioBandarmologyRow {
  string emiten_name = 1;
  // Tanggal snapshot YYYY-MM-DD (contoh "2026-07-21").
  string tahun_bulan_tanggal = 2;
  BandarmologyDay bandarmology = 3;
}

message BandarmologyDay {
  BandarmologyTopStats top_1 = 1;
  BandarmologyTopStats top_3 = 2;
  BandarmologyTopStats top_5 = 3;
  BandarmologyTopStats average = 4;
  int64 net_volume = 5;
  string net_value = 6;
  int64 average_rp = 7;
  repeated BandarmologyBrokerBuy broker_buy = 8;
  repeated BandarmologyBrokerSell broker_sell = 9;
}

message BandarmologyTopStats {
  int64 volume = 1;
  double percent = 2;
  int64 rp_b = 3;
  string acc_dist = 4;
}

message BandarmologyBrokerBuy {
  string broker_code = 1;
  string buy_volume = 2;
  string buy_lot = 3;
  int64 buy_avg = 4;
}

message BandarmologyBrokerSell {
  string broker_code = 1;
  string sell_volume = 2;
  string sell_lot = 3;
  int64 sell_avg = 4;
}
