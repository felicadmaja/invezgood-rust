syntax = "proto3";

package portofolio_bandarmology;

service PortofolioBandarmology {
  // Salin snapshot bandarmology minggu berjalan ke tabel `portofolio_bandarmology`.
  // Alur:
  // 1. Baca Scylla `bandarmology` WHERE agg_tahun_bulan_emiten_name =
  //    format("%Y-%m", now) + '_' + emiten_name (UPPERCASE).
  // 2. Pilih kolom minggu sesuai hari (tanggal kalender lokal) hari ini:
  //    - tgl 1–8  (inclusive) → broker_summary_current_w1
  //    - tgl 9–15 (inclusive) → broker_summary_current_w2
  //    - tgl 16–22 (inclusive) → broker_summary_current_w3
  //    - tgl 23–31 (inclusive) → broker_summary_current_w4
  // 3. Upsert ke `portofolio_bandarmology`:
  //    emiten_name = request.emiten_name (UPPERCASE)
  //    tahun_bulan_tanggal = today (YYYY-MM-DD)
  //    bandarmology = UDT yang dipilih di langkah 2
  // Gagal bila baris bandarmology tidak ada / kolom minggu kosong → NOT_FOUND.
  // emiten_name: tepat 4 huruf; dinormalisasi ke UPPERCASE.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc InsertPortofolioBandarmology(InsertPortofolioBandarmologyRequest)
      returns (InsertPortofolioBandarmologyResponse);
}

message InsertPortofolioBandarmologyRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE (bbca → BBCA).
  string emiten_name = 1;
}

message InsertPortofolioBandarmologyResponse {
  bool success = 1;
  string message = 2;
  // Baris yang baru di-upsert; kosong jika gagal.
  PortofolioBandarmologyRow row = 3;
}

message PortofolioBandarmologyRow {
  string emiten_name = 1;
  // Tanggal snapshot YYYY-MM-DD (contoh "2026-07-21").
  string tahun_bulan_tanggal = 2;
  BandarmologyDay bandarmology = 3;
}

message BandarmologyDay {
  BandarmologyTopStats top_1 = 1;
  BandarmologyTopStats top_3 = 2;
  BandarmologyTopStats top_5 = 3;
  BandarmologyTopStats average = 4;
  int64 net_volume = 5;
  string net_value = 6;
  int64 average_rp = 7;
  repeated BandarmologyBrokerBuy broker_buy = 8;
  repeated BandarmologyBrokerSell broker_sell = 9;
}

message BandarmologyTopStats {
  int64 volume = 1;
  double percent = 2;
  int64 rp_b = 3;
  string acc_dist = 4;
}

message BandarmologyBrokerBuy {
  string broker_code = 1;
  string buy_volume = 2;
  string buy_lot = 3;
  int64 buy_avg = 4;
}

message BandarmologyBrokerSell {
  string broker_code = 1;
  string sell_volume = 2;
  string sell_lot = 3;
  int64 sell_avg = 4;
}
