syntax = "proto3";

package pending_order;

service PendingOrder {
  // Baca semua baris dari tabel Scylla `pending_order` via token-ring scan
  // (semua status: OPEN / MATCH / REJECTED / dll.).
  // Request kosong. Response: repeated PendingOrderRow.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetAllPendingOrderFromScylla(GetAllPendingOrderFromScyllaRequest)
      returns (GetAllPendingOrderFromScyllaResponse);

  // Baca baris `pending_order` untuk satu emiten via MV `pending_order_by_emiten_name`.
  // Request: emiten_name (4 huruf, dinormalisasi uppercase).
  // Response: repeated PendingOrderRow (kosong bila tidak ada).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetPendingOrderFromScyllaByEmitenName(GetPendingOrderFromScyllaByEmitenNameRequest)
      returns (GetPendingOrderFromScyllaByEmitenNameResponse);

  // Scrape semua order dari Stockbit lalu upsert `pending_order`.
  // Alur sama `pending_order_worker`: login → START TRADING/PIN bila perlu →
  // GET carina.stockbit.com/order/v2/list → TRUNCATE+insert `pending_order`.
  // Rate limit: maksimal 1× per 5 menit untuk semua user
  // (failed precondition jika terlalu cepat).
  // Hanya hari operasional Senin–Jumat dan jam server 09:00–12:00 serta 13:30–16:00
  // (failed precondition: "Diluar hari operasional Senin-Jumat..." atau
  // "Diluar jam 09:00-12:00 dan 13:30-16:00").
  // Tidak berlaku untuk bin worker_scrapping.
  // Request kosong. Response: repeated PendingOrderRow setelah scrape.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetAllPendingOrderFromStockbit(GetAllPendingOrderFromStockbitRequest)
      returns (GetAllPendingOrderFromStockbitResponse);

  // Buat order limit buy via DOM scrape Stockbit (mode trading + PIN bila perlu).
  // Validasi: emiten_name 4 huruf; price/lot integer > 0; expiry harus GFD atau GTC.
  // Rate limit: maksimal 1× per 60 detik untuk semua user
  // (failed precondition jika terlalu cepat).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc CreateBuyLimitOrder(CreateBuyLimitOrderRequest)
      returns (CreateBuyLimitOrderResponse);
}

enum ExpiryPendingOrder {
  EXPIRY_PENDING_ORDER_UNSPECIFIED = 0;
  EXPIRY_PENDING_ORDER_GFD = 1;
  EXPIRY_PENDING_ORDER_GTC = 2;
}

message GetAllPendingOrderFromScyllaRequest {}
message GetAllPendingOrderFromStockbitRequest {}

message GetPendingOrderFromScyllaByEmitenNameRequest {
  string emiten_name = 1;
}

message GetPendingOrderFromScyllaByEmitenNameResponse {
  repeated PendingOrderRow rows = 1;
}

message CreateBuyLimitOrderRequest {
  // Kode emiten: tepat 4 huruf alphabet; dinormalisasi UPPERCASE di server.
  string emiten_name = 1;
  // Harus < current_price.
  int32 buylimit_price = 2;
  int32 current_price = 3;
  int32 lot = 4;
  // Wajib GFD (1) atau GTC (2).
  ExpiryPendingOrder expiry = 5;
}

message CreateBuyLimitOrderResponse {
  bool success = 1;
  string message = 2;
}

message PendingOrderRow {
  string order_id = 1;
  string emiten_name = 2;
  string status = 3;
  string message = 4;
  string side = 5;
  // RFC3339 timestamp (contoh 2026-07-20T13:04:25Z)
  string time_open = 6;
  double lot_open = 7;
  double lot_done = 8;
  double price_order = 9;
  double amount_open = 10;
  double amount_match = 11;
  double amount_match_total = 12;
  bool is_gtc = 13;
  // RFC3339 timestamp; kosong bila null
  string updated_at = 14;
}

message GetAllPendingOrderFromScyllaResponse {
  repeated PendingOrderRow rows = 1;
}

message GetAllPendingOrderFromStockbitResponse {
  bool success = 1;
  string message = 2;
  repeated PendingOrderRow rows = 3;
}
