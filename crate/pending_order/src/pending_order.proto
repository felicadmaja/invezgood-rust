syntax = "proto3";

package pending_order;

service PendingOrder {
  // Baca semua baris dari tabel Scylla `pending_order` via token-ring scan
  // (semua status: OPEN / MATCH / REJECTED / dll.).
  // Request kosong. Response: repeated PendingOrderRow.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetAllPendingOrderFromScylla(GetAllPendingOrderFromScyllaRequest)
      returns (GetAllPendingOrderFromScyllaResponse);

  // Scrape semua order dari Stockbit lalu upsert `pending_order`.
  // Alur sama `pending_order_worker`: login → START TRADING/PIN bila perlu →
  // GET carina.stockbit.com/order/v2/list → TRUNCATE+insert `pending_order`.
  // Rate limit: maksimal 1× per 5 menit untuk semua user
  // (failed precondition jika terlalu cepat).
  // Request kosong. Response: repeated PendingOrderRow setelah scrape.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetAllPendingOrderFromStockbit(GetAllPendingOrderFromStockbitRequest)
      returns (GetAllPendingOrderFromStockbitResponse);
}

message GetAllPendingOrderFromScyllaRequest {}
message GetAllPendingOrderFromStockbitRequest {}

message PendingOrderRow {
  string order_id = 1;
  string emiten_name = 2;
  string status = 3;
  string message = 4;
  string side = 5;
  // RFC3339 timestamp (contoh 2026-07-20T13:04:25Z)
  string time_open = 6;
  double lot_open = 7;
  double lot_done = 8;
  double price_order = 9;
  double amount_open = 10;
  double amount_match = 11;
  double amount_match_total = 12;
  bool is_gtc = 13;
  // RFC3339 timestamp; kosong bila null
  string updated_at = 14;
}

message GetAllPendingOrderFromScyllaResponse {
  repeated PendingOrderRow rows = 1;
}

message GetAllPendingOrderFromStockbitResponse {
  bool success = 1;
  string message = 2;
  repeated PendingOrderRow rows = 3;
}
