syntax = "proto3";

package pending_order;

service PendingOrder {
  // Memerlukan user login (admin). Kirim metadata: authorization: Bearer <token>.

  // Baca pending order by tanggal via MV pending_order_by_tahun_bulan_tanggal.
  // Request: tahun_bulan_tanggal (YYYY-MM-DD) wajib.
  rpc GetAllPendingOrderFromScylla(GetAllPendingOrderFromScyllaRequest)
      returns (GetAllPendingOrderFromScyllaResponse);

  // Baca pending order by bulan via MV pending_order_by_tahun_bulan.
  // Request: tahun_bulan (YYYY-MM) wajib.
  rpc GetAllPendingOrderByTahunBulanFromScylla(GetAllPendingOrderByTahunBulanFromScyllaRequest)
      returns (GetAllPendingOrderByTahunBulanFromScyllaResponse);

  // Baca pending order per emiten via MV pending_order_by_emiten_name.
  rpc GetPendingOrderFromScyllaByEmitenName(GetPendingOrderFromScyllaByEmitenNameRequest)
      returns (GetPendingOrderFromScyllaByEmitenNameResponse);

  // Invoke RPC langsung (admin): tanpa batas hari/jam; rate limit global 1× / 3 menit
  // → success=false + message rate limit (bukan gRPC error).
  // Auto dari IsStockbitReady poller: Senin–Kamis 09:00–12:00 & 13:30–16:00;
  // Jumat 09:00–11:30 & 14:00–16:00 bila Stockbit ready
  // (poller selalu jalan tanpa perlu subscriber). Scrape order Stockbit
  // (carina.stockbit.com/order/v2/list) via Chrome → upsert invezgood.pending_order.
  rpc GetAllPendingOrderFromStockbit(GetAllPendingOrderFromStockbitRequest)
      returns (GetAllPendingOrderFromStockbitResponse);

  // Buat order limit buy via DOM scrape Stockbit. Rate limit: 1× / 30 detik global.
  // Belum tersedia di invezgood — UNIMPLEMENTED sampai worker Stockbit diintegrasikan.
  rpc CreateBuyLimitOrder(CreateBuyLimitOrderRequest)
      returns (CreateBuyLimitOrderResponse);
}

enum ExpiryPendingOrder {
  EXPIRY_PENDING_ORDER_UNSPECIFIED = 0;
  EXPIRY_PENDING_ORDER_GFD = 1;
  EXPIRY_PENDING_ORDER_GTC = 2;
}

message GetAllPendingOrderFromScyllaRequest {
  // Tanggal filter YYYY-MM-DD → MV pending_order_by_tahun_bulan_tanggal.
  string tahun_bulan_tanggal = 1;
}

message GetAllPendingOrderByTahunBulanFromScyllaRequest {
  // Filter YYYY-MM → MV pending_order_by_tahun_bulan.
  string tahun_bulan = 1;
}

message GetAllPendingOrderFromStockbitRequest {}

message GetPendingOrderFromScyllaByEmitenNameRequest {
  string emiten_name = 1;
}

message GetPendingOrderFromScyllaByEmitenNameResponse {
  repeated PendingOrderRow rows = 1;
}

message CreateBuyLimitOrderRequest {
  string emiten_name = 1;
  int32 buylimit_price = 2;
  int32 current_price = 3;
  int32 lot = 4;
  ExpiryPendingOrder expiry = 5;
}

message CreateBuyLimitOrderResponse {
  bool success = 1;
  string message = 2;
}

message PendingOrderRow {
  string order_id = 1;
  string emiten_name = 2;
  string status = 3;
  string message = 4;
  string side = 5;
  string time_open = 6;
  double lot_open = 7;
  double lot_done = 8;
  double price_order = 9;
  double amount_open = 10;
  double amount_match = 11;
  double amount_match_total = 12;
  bool is_gtc = 13;
  string updated_at = 14;
  // Tanggal dari time_open (YYYY-MM-DD); clustering key DESC.
  string tahun_bulan_tanggal = 15;
  // YYYY-MM dari tahun_bulan_tanggal.
  string tahun_bulan = 16;
}

message GetAllPendingOrderFromScyllaResponse {
  repeated PendingOrderRow rows = 1;
}

message GetAllPendingOrderByTahunBulanFromScyllaResponse {
  repeated PendingOrderRow rows = 1;
}

message GetAllPendingOrderFromStockbitResponse {
  bool success = 1;
  string message = 2;
  repeated PendingOrderRow rows = 3;
}
