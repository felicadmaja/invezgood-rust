syntax = "proto3";

package pending_order;

service PendingOrder {
  // Token-ring scan seluruh baris tabel Scylla `pending_order`.
  // Request kosong. Response: repeated PendingOrderRow.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetAllPendingOrder(GetAllPendingOrderRequest) returns (GetAllPendingOrderResponse);
}

message GetAllPendingOrderRequest {}

message PendingOrderRow {
  string order_id = 1;
  string emiten_name = 2;
  string status = 3;
  string message = 4;
  string side = 5;
  // YYYY-MM-DD
  string time_open = 6;
  double lot_open = 7;
  double lot_done = 8;
  double price_order = 9;
  double amount_open = 10;
  double amount_match = 11;
  double amount_match_total = 12;
  bool is_gtc = 13;
  // YYYY-MM-DD; kosong bila null
  string updated_at = 14;
}

message GetAllPendingOrderResponse {
  repeated PendingOrderRow rows = 1;
}
