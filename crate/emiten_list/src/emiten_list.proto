syntax = "proto3";

package emiten_list;

service EmitenList {
  // Tanpa parameter request; token-ring scan seluruh baris tabel Scylla `emiten_list`.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetAllEmitenListFromScylla(GetAllEmitenListFromScyllaRequest)
      returns (GetAllEmitenListFromScyllaResponse);

  // Lookup satu baris via PK base table: emiten_list.emiten_name = emiten_name.
  // emiten_name: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  // Hanya baca dari Scylla; tidak scrape Stockbit. Bila tidak ada → NOT_FOUND.
  // Response `EmitenListRow.net_income`: tahun → { Q1..Q4 / Annualised / TTM… → nilai }.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetEmitenListByEmitenNameFromScylla(GetEmitenListByEmitenNameFromScyllaRequest) returns (GetEmitenListByEmitenNameFromScyllaResponse);


  // Lookup banyak emiten via PK (hanya baca Scylla, tidak scrape).
  // emiten_name dinormalisasi UPPERCASE; duplikat di-skip; kode invalid diabaikan.
  // Response hanya baris yang ada di Scylla (yang tidak ketemu tidak ikut).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetMultiEmitenListFromScylla(GetMultiEmitenListFromScyllaRequest)
      returns (GetMultiEmitenListFromScyllaResponse);

  // Lookup satu emiten: baca Scylla dulu; scrape Key Stats + Corp.Action + Profile dari Stockbit
  // hanya bila baris tidak ada atau `update_at` kosong / sudah ≥ 30 hari; upsert lalu baca baris lengkap.
  // Bila baris belum ada di `emiten_list`: selain upsert emiten, scrape API bandarmology untuk kode tersebut.
  // emiten_name: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  // Bila API Stockbit HTTP 400 / emiten tidak di BEI: response `row` kosong (tanpa error gRPC).
  // HTTP 4xx dari RPC **tidak** menghentikan app (hanya bin worker yang abort).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetEmitenListByEmitenNameFromStockbit(GetEmitenListByEmitenNameFromStockbitRequest) returns (GetEmitenListByEmitenNameFromStockbitResponse);

  // Update kolom `is_fundamental_solid` untuk satu emiten (PK emiten_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc UpdateEmitenListFundamental(UpdateEmitenListFundamentalRequest) returns (UpdateEmitenListFundamentalResponse);

  // Update `emiten_list.sector` (tinyint) dan sync nilai yang sama ke semua baris
  // `emiten_trending.sector` (tinyint) untuk `emiten_name` yang sama (via MV by_emiten_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc UpdateEmitenListSector(UpdateEmitenListSectorRequest) returns (UpdateEmitenListSectorResponse);

  // Update kolom `is_konglomerasi` untuk satu emiten (PK emiten_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc UpdateEmitenListKonglomerasi(UpdateEmitenListKonglomerasiRequest) returns (UpdateEmitenListKonglomerasiResponse);

  // Update kolom `is_blue_chip` untuk satu emiten (PK emiten_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc UpdateEmitenListBlueChip(UpdateEmitenListBlueChipRequest) returns (UpdateEmitenListBlueChipResponse);

  // Update kolom `catatan` untuk satu emiten (PK emiten_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc UpdateEmitenListCatatan(UpdateEmitenListCatatanRequest) returns (UpdateEmitenListCatatanResponse);

  // Update kolom `catatan_owner` untuk satu emiten (PK emiten_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc UpdateEmitenListCatatanOwner(UpdateEmitenListCatatanOwnerRequest) returns (UpdateEmitenListCatatanOwnerResponse);

  // Update kolom `foto_owner` (list<path GCS>) untuk satu emiten (PK emiten_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc UpdateEmitenListPhotoProfileOwner(UpdateEmitenListPhotoProfileOwnerRequest) returns (UpdateEmitenListPhotoProfileOwnerResponse);

  // Update kolom `is_plan_to_trade` untuk satu emiten (PK emiten_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc UpdateEmitenListPlanToTrade(UpdateEmitenListPlanToTradeRequest) returns (UpdateEmitenListPlanToTradeResponse);


  // Baca kolom `takeprofit_wyckoff` untuk satu emiten (PK emiten_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetTakeProfitWyckoff(GetTakeProfitWyckoffRequest) returns (GetTakeProfitWyckoffResponse);

  // Update kolom `takeprofit_wyckoff` (map<text,text>) untuk satu emiten (PK emiten_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc UpdateTakeProfitWyckoff(UpdateTakeProfitWyckoffRequest) returns (UpdateTakeProfitWyckoffResponse);


  // Update kolom `wyckoff_phase_element` untuk satu emiten (PK emiten_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc UpdateWyckoffPhaseElement(UpdateWyckoffPhaseElementRequest) returns (UpdateWyckoffPhaseElementResponse);

  // Baca kolom `wyckoff_phase_element` untuk satu emiten (PK emiten_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetWyckoffPhaseElement(GetWyckoffPhaseElementRequest) returns (GetWyckoffPhaseElementResponse);

  // Baca kolom `wyckoff_trading_range` untuk satu emiten (PK emiten_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetWyckoffTradingRange(GetWyckoffTradingRangeRequest) returns (GetWyckoffTradingRangeResponse);

  // Update kolom `wyckoff_trading_range` untuk satu emiten (PK emiten_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc UpdateWyckoffTradingRange(UpdateWyckoffTradingRangeRequest) returns (UpdateWyckoffTradingRangeResponse);
}

// Kode sektor emiten; disimpan di Scylla `emiten_list.sector` sebagai tinyint.
enum EmitenSector {
  EMITEN_SECTOR_UNSPECIFIED = 0;
  TAMBANG_BATUBARA = 1;
  TAMBANG_MINYAK_GAS = 2;
  PETROKIMIA = 3;
  TAMBANG_EMAS_TEMBAGA = 4;
  TAMBANG_NIKEL = 5;
  TAMBANG_TIMAH = 6;
  INFRASTRUKTUR_TAMBANG = 7;
  LOGISTIK_TAMBANG = 8;
  DISTRIBUSI_TAMBANG = 9;
  BANK = 10;
  MULTIFINANCE = 11;
  ASURANSI = 12;
  JASA_INVESTASI = 13;
  KAYU_KERTAS = 14;
  PERKEBUNAN_SAWIT = 15;
  PERKEBUNAN_TEBU = 16;
  PERKEBUNAN_LAIN = 17;
  PERTANIAN = 18;
  RUMAH_SAKIT = 19;
  LABORATORIUM_KESEHATAN = 20;
  ALAT_KESEHATAN = 21;
  PRODUSEN_OBAT = 22;
  PRODUSEN_MAKANAN = 23;
  PRODUSEN_PRODUK_RUMAH_TANGGA = 24;
  PRODUSEN_ROKOK = 25;
  DISTRIBUTOR_BARANG_PRIMER = 26;
  RETAIL_BARANG_PRIMER = 27;
  POULTRY = 28;
  TELEKOMUNIKASI = 29;
  INFRASTRUKTUR_TELEKOMUNIKASI = 30;
  TEKNOLOGI = 31;
  PROPERTY = 32;
  KONSTRUKSI = 33;
  SEMEN = 34;
  PRODUSEN_BESI = 35;
  DISTRIBUTOR_BAHAN_BANGUNAN = 36;
  PELABUHAN_PELAYARAN = 37;
  PRODUSEN_OTOMOTIF = 38;
  DISTRIBUTOR_OTOMOTIF = 39;
  RETAIL_OTOMOTIF = 40;
  PLASTIK = 41;
  MEDIA = 42;
  UTILITAS_PUBLIK = 43;
  LOGISTIK_PENGANTARAN = 44;
  HOLDING_COMPANY = 45;
  JASA_PERINDUSTRIAN = 46;
}

message GetAllEmitenListFromScyllaRequest {}

message GetEmitenListByEmitenNameFromScyllaRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  string emiten_name = 1;
}

message GetEmitenListByEmitenNameFromScyllaResponse {
  EmitenListRow row = 1;
}

message GetMultiEmitenListFromScyllaRequest {
  // Daftar kode emiten (4 huruf); dinormalisasi UPPERCASE; duplikat di-skip.
  repeated string emiten_name = 1;
}

message GetMultiEmitenListFromScyllaResponse {
  repeated EmitenListRow rows = 1;
}

message GetEmitenListByEmitenNameFromStockbitRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  // Jika tidak ditemukan di API Stockbit → error NOT_FOUND: "Nama emiten tidak ada di BEI".
  string emiten_name = 1;
}

message GetEmitenListByEmitenNameFromStockbitResponse {
  EmitenListRow row = 1;
}

message UpdateEmitenListFundamentalRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  string emiten_name = 1;
  bool is_fundamental_solid = 2;
}

message UpdateEmitenListFundamentalResponse {
  bool success = 1;
  string message = 2;
  EmitenListRow row = 3;
}

message UpdateEmitenListSectorRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  string emiten_name = 1;
  EmitenSector sector = 2;
}

message UpdateEmitenListSectorResponse {
  bool success = 1;
  string message = 2;
  EmitenListRow row = 3;
}

message UpdateEmitenListKonglomerasiRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  string emiten_name = 1;
  bool is_konglomerasi = 2;
}

message UpdateEmitenListKonglomerasiResponse {
  bool success = 1;
  string message = 2;
  EmitenListRow row = 3;
}

message UpdateEmitenListBlueChipRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  string emiten_name = 1;
  bool is_blue_chip = 2;
}

message UpdateEmitenListBlueChipResponse {
  bool success = 1;
  string message = 2;
  EmitenListRow row = 3;
}

message UpdateEmitenListPlanToTradeRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  string emiten_name = 1;
  bool is_plan_to_trade = 2;
}

message UpdateEmitenListPlanToTradeResponse {
  bool success = 1;
  string message = 2;
  EmitenListRow row = 3;
}

message UpdateEmitenListCatatanRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  string emiten_name = 1;
  // Bentuk CQL map<text, text>.
  map<string, string> catatan = 2;
}

message UpdateEmitenListCatatanResponse {
  bool success = 1;
  string message = 2;
  EmitenListRow row = 3;
}

message UpdateEmitenListCatatanOwnerRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  string emiten_name = 1;
  string catatan_owner = 2;
}

message UpdateEmitenListCatatanOwnerResponse {
  bool success = 1;
  string message = 2;
  EmitenListRow row = 3;
}

message UpdateEmitenListPhotoProfileOwnerRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  string emiten_name = 1;
  // Path object GCS; disimpan ke kolom Scylla `foto_owner` (list<text>).
  repeated string foto_owner_gcs_path = 2;
}

message UpdateEmitenListPhotoProfileOwnerResponse {
  bool success = 1;
  string message = 2;
  EmitenListRow row = 3;
}

message GetTakeProfitWyckoffRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  string emiten_name = 1;
}

message GetTakeProfitWyckoffResponse {
  // Bentuk CQL map<text, text>; kosong bila belum di-set.
  map<string, string> takeprofit_wyckoff = 1;
}

message UpdateTakeProfitWyckoffRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  string emiten_name = 1;
  int32 n_kolom = 2;
  int32 harga_xo_frequent = 3;
  int32 low = 4;
  int32 takeprofit_1 = 5;
  int32 takeprofit_2 = 6;
}

message UpdateTakeProfitWyckoffResponse {
  bool success = 1;
  string message = 2;
}

// Wrapper list untuk nilai map CQL `frozen<list<text>>`.
message TextList {
  repeated string values = 1;
}

message GetWyckoffPhaseElementRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  string emiten_name = 1;
}

message GetWyckoffPhaseElementResponse {
  // Bentuk CQL map<text, frozen<list<text>>>; kosong bila belum di-set.
  map<string, TextList> wyckoff_phase_element = 1;
}

message GetWyckoffTradingRangeRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  string emiten_name = 1;
}

message GetWyckoffTradingRangeResponse {
  // Bentuk CQL list<int>; kosong bila belum di-set.
  repeated int32 wyckoff_trading_range = 1;
}

message UpdateWyckoffTradingRangeRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  string emiten_name = 1;
  // Bentuk CQL list<int>.
  repeated int32 wyckoff_trading_range = 2;
}

message UpdateWyckoffTradingRangeResponse {
  bool success = 1;
  string message = 2;
}

message UpdateWyckoffPhaseElementRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE di server (bbca → BBCA).
  string emiten_name = 1;
  // Bentuk CQL map<text, frozen<list<text>>>.
  map<string, TextList> wyckoff_phase_element = 2;
}

message UpdateWyckoffPhaseElementResponse {
  bool success = 1;
  string message = 2;
}

// Satu pasangan atribut aksi korporasi, contoh {"Cum Date": "20 Apr 26"}.
message CorporateActionKv {
  map<string, string> entries = 1;
}

// Detail satu jenis aksi, contoh list [{"Dividend":"Rp 209"}, {"Cum Date":"..."}, ...].
message CorporateActionDetailList {
  repeated CorporateActionKv items = 1;
}

// Satu elemen list corporate_action, contoh {"Dividend": [ ...details... ]}.
message CorporateActionGroup {
  map<string, CorporateActionDetailList> by_type = 1;
}

message EmitenShareholderGt1 {
  string name = 1;
  string type = 2;
  string location = 3;
  string domicile = 4;
  string scriples = 5;
  string scrip = 6;
  string total_shares = 7;
  string percentage = 8;
}

message EmitenShareholder {
  string name = 1;
  string value = 2;
  string shares = 3;
}

message CompanyProfile {
  string company_background = 1;
  string sector = 2;
  repeated EmitenShareholderGt1 shareholder_more_than_one_percent = 3;
  repeated EmitenShareholder shareholders = 4;
  string ultimate_beneficial_owner = 5;
}

message EmitenListRow {
  string emiten_name = 1;
  string long_name = 2;
  // map<label, value> dari UI Key Stats, termasuk Cash Flow Statement TTM:
  // "Cash From Operations (TTM)", "Cash From Investing (TTM)",
  // "Cash From Financing (TTM)", "Capital expenditure (TTM)", "Free cash flow (TTM)".
  map<string, string> key_stats = 3;
  // Bentuk: [{"Dividend":[{"Dividend":"Rp 209"},{"Cum Date":"..."},...]}, ...]
  repeated CorporateActionGroup corporate_action = 4;
  CompanyProfile company_profile = 5;
  // RFC3339 / ISO-8601 timestamp string (kosong bila null di Scylla).
  string update_at = 6;
  // Path gcs object
  string emiten_icon = 7;
  // Default false
  bool is_konglomerasi = 8;
  // Nilai enum ↔ kolom Scylla `sector` (tinyint).
  EmitenSector sector = 9;
  bool is_fundamental_solid = 10;
  bool is_blue_chip = 11;
  // Tahun → periode → nilai; bentuk CQL map<text, frozen<map<text, text>>>.
  // Contoh: "2026" → { "Q1": "1,387 B", "Annualised": "5,547 B", "TTM (Q1)": "3,855 B", ... }.
  map<string, NetIncomeYear> net_income = 12;
  // Default false — rencana untuk trade.
  bool is_plan_to_trade = 13;
  // Bentuk CQL map<text, text> — catatan manual (key-value).
  map<string, string> catatan = 14;
  string catatan_owner = 15;
  // Path/URL foto pemilik catatan; bentuk CQL list<text>.
  repeated string foto_owner = 16;
  // Bentuk CQL map<text, text> — take-profit / Wyckoff (key-value string).
  // Diisi RPC UpdateTakeProfitWyckoff: n_kolom, harga_xo_frequent, low, takeprofit_1, takeprofit_2.
  map<string, string> takeprofit_wyckoff = 17;
  // Bentuk CQL map<text, frozen<list<text>>> — fase/elemen Wyckoff.
  map<string, TextList> wyckoff_phase_element = 18;
  // Bentuk CQL list<int> — rentang trading Wyckoff.
  repeated int32 wyckoff_trading_range = 19;
}

// Satu tahun net income: periode (Q1..Q4, Annualised, TTM ...) → nilai teks.
message NetIncomeYear {
  map<string, string> periods = 1;
}

message GetAllEmitenListFromScyllaResponse {
  repeated EmitenListRow rows = 1;
}
