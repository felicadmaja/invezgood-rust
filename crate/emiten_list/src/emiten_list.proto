syntax = "proto3";

package emiten_list;

service EmitenList {
  // Tanpa parameter request; token-ring scan seluruh baris tabel Scylla `emiten_list`.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetAllEmitenList(GetAllEmitenListRequest) returns (GetAllEmitenListResponse);

  // Lookup satu baris via PK base table: emiten_list.code_name = code_name.
  // code_name di server di-capitalize ke uppercase (bbca → BBCA).
  // Bila tidak ada di Scylla: scrape Key Stats (+ tabel Period (IDR) → net_income,
  // emiten_icon dari header / trending → GCS), Corporate Action, Profile;
  // upsert lalu UPDATE update_at = now().
  // Response `EmitenListRow.net_income`: tahun → { Q1..Q4 / Annualised / TTM… → nilai }.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetEmitenListByCodeName(GetEmitenListByCodeNameRequest) returns (GetEmitenListByCodeNameResponse);

  // Update kolom `is_fundamental_solid` untuk satu emiten (PK code_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc UpdateEmitenListFundamental(UpdateEmitenListFundamentalRequest) returns (UpdateEmitenListFundamentalResponse);

  // Update kolom `sector` untuk satu emiten (PK code_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc UpdateEmitenListSector(UpdateEmitenListSectorRequest) returns (UpdateEmitenListSectorResponse);

  // Update kolom `is_konglomerasi` untuk satu emiten (PK code_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc UpdateEmitenListKonglomerasi(UpdateEmitenListKonglomerasiRequest) returns (UpdateEmitenListKonglomerasiResponse);

  // Update kolom `is_blue_chip` untuk satu emiten (PK code_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc UpdateEmitenListBlueChip(UpdateEmitenListBlueChipRequest) returns (UpdateEmitenListBlueChipResponse);

  // Update kolom `catatan` untuk satu emiten (PK code_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc UpdateEmitenListCatatan(UpdateEmitenListCatatanRequest) returns (UpdateEmitenListCatatanResponse);

  // Update kolom `catatan_owner` dan `foto_owner` untuk satu emiten (PK code_name).
  // Request field `foto_owner_gcs_path` disimpan ke kolom Scylla `foto_owner`.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc UpdateEmitenListOwner(UpdateEmitenListOwnerRequest) returns (UpdateEmitenListOwnerResponse);

  // Update kolom `is_plan_to_trade` untuk satu emiten (PK code_name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc UpdateEmitenListPlanToTrade(UpdateEmitenListPlanToTradeRequest) returns (UpdateEmitenListPlanToTradeResponse);
}

// Kode sektor emiten; disimpan di Scylla `emiten_list.sector` sebagai tinyint.
enum EmitenSector {
  EMITEN_SECTOR_UNSPECIFIED = 0;
  TAMBANG_BATUBARA = 1;
  TAMBANG_MINYAK_GAS = 2;
  PETROKIMIA = 3;
  TAMBANG_EMAS_TEMBAGA = 4;
  TAMBANG_NIKEL = 5;
  TAMBANG_TIMAH = 6;
  INFRASTRUKTUR_TAMBANG = 7;
  LOGISTIK_TAMBANG = 8;
  DISTRIBUSI_TAMBANG = 9;
  BANK = 10;
  MULTIFINANCE = 11;
  ASURANSI = 12;
  JASA_INVESTASI = 13;
  KAYU_KERTAS = 14;
  PERKEBUNAN_SAWIT = 15;
  PERKEBUNAN_TEBU = 16;
  PERKEBUNAN_LAIN = 17;
  PERTANIAN = 18;
  RUMAH_SAKIT = 19;
  LABORATORIUM_KESEHATAN = 20;
  ALAT_KESEHATAN = 21;
  PRODUSEN_OBAT = 22;
  PRODUSEN_MAKANAN = 23;
  PRODUSEN_PRODUK_RUMAH_TANGGA = 24;
  PRODUSEN_ROKOK = 25;
  DISTRIBUTOR_BARANG_PRIMER = 26;
  RETAIL_BARANG_PRIMER = 27;
  POULTRY = 28;
  TELEKOMUNIKASI = 29;
  INFRASTRUKTUR_TELEKOMUNIKASI = 30;
  TEKNOLOGI = 31;
  PROPERTY = 32;
  KONSTRUKSI = 33;
  SEMEN = 34;
  PRODUSEN_BESI = 35;
  DISTRIBUTOR_BAHAN_BANGUNAN = 36;
  PELABUHAN_PELAYARAN = 37;
  PRODUSEN_OTOMOTIF = 38;
  DISTRIBUTOR_OTOMOTIF = 39;
  RETAIL_OTOMOTIF = 40;
  PLASTIK = 41;
  MEDIA = 42;
  UTILITAS_PUBLIK = 43;
  LOGISTIK_PENGANTARAN = 44;
  HOLDING_COMPANY = 45;
  JASA_PERINDUSTRIAN = 46;
}

message GetAllEmitenListRequest {}

message GetEmitenListByCodeNameRequest {
  // Kode emiten / ticker (contoh "BBCA").
  string code_name = 1;
}

message GetEmitenListByCodeNameResponse {
  EmitenListRow row = 1;
}

message UpdateEmitenListFundamentalRequest {
  // Kode emiten / ticker (contoh "BBCA"); di-capitalize ke uppercase di server.
  string code_name = 1;
  bool is_fundamental_solid = 2;
}

message UpdateEmitenListFundamentalResponse {
  bool success = 1;
  string message = 2;
  EmitenListRow row = 3;
}

message UpdateEmitenListSectorRequest {
  // Kode emiten / ticker (contoh "BBCA"); di-capitalize ke uppercase di server.
  string code_name = 1;
  EmitenSector sector = 2;
}

message UpdateEmitenListSectorResponse {
  bool success = 1;
  string message = 2;
  EmitenListRow row = 3;
}

message UpdateEmitenListKonglomerasiRequest {
  // Kode emiten / ticker (contoh "BBCA"); di-capitalize ke uppercase di server.
  string code_name = 1;
  bool is_konglomerasi = 2;
}

message UpdateEmitenListKonglomerasiResponse {
  bool success = 1;
  string message = 2;
  EmitenListRow row = 3;
}

message UpdateEmitenListBlueChipRequest {
  // Kode emiten / ticker (contoh "BBCA"); di-capitalize ke uppercase di server.
  string code_name = 1;
  bool is_blue_chip = 2;
}

message UpdateEmitenListBlueChipResponse {
  bool success = 1;
  string message = 2;
  EmitenListRow row = 3;
}

message UpdateEmitenListPlanToTradeRequest {
  // Kode emiten / ticker (contoh "BBCA"); di-capitalize ke uppercase di server.
  string code_name = 1;
  bool is_plan_to_trade = 2;
}

message UpdateEmitenListPlanToTradeResponse {
  bool success = 1;
  string message = 2;
  EmitenListRow row = 3;
}

message UpdateEmitenListCatatanRequest {
  // Kode emiten / ticker (contoh "BBCA"); di-capitalize ke uppercase di server.
  string code_name = 1;
  string catatan = 2;
  
}

message UpdateEmitenListCatatanResponse {
  bool success = 1;
  string message = 2;
  EmitenListRow row = 3;
}

message UpdateEmitenListOwnerRequest {
  // Kode emiten / ticker (contoh "BBCA"); di-capitalize ke uppercase di server.
  string code_name = 1;
  string catatan_owner = 2;
  // Path object GCS; disimpan ke kolom Scylla `foto_owner`.
  string foto_owner_gcs_path = 3;
}

message UpdateEmitenListOwnerResponse {
  bool success = 1;
  string message = 2;
  EmitenListRow row = 3;
}

// Satu pasangan atribut aksi korporasi, contoh {"Cum Date": "20 Apr 26"}.
message CorporateActionKv {
  map<string, string> entries = 1;
}

// Detail satu jenis aksi, contoh list [{"Dividend":"Rp 209"}, {"Cum Date":"..."}, ...].
message CorporateActionDetailList {
  repeated CorporateActionKv items = 1;
}

// Satu elemen list corporate_action, contoh {"Dividend": [ ...details... ]}.
message CorporateActionGroup {
  map<string, CorporateActionDetailList> by_type = 1;
}

message EmitenShareholderGt1 {
  string name = 1;
  string type = 2;
  string location = 3;
  string domicile = 4;
  string scriples = 5;
  string scrip = 6;
  string total_shares = 7;
  string percentage = 8;
}

message EmitenShareholder {
  string name = 1;
  string value = 2;
  string shares = 3;
}

message CompanyProfile {
  string company_background = 1;
  string sector = 2;
  repeated EmitenShareholderGt1 shareholder_more_than_one_percent = 3;
  repeated EmitenShareholder shareholders = 4;
  string ultimate_beneficial_owner = 5;
}

message EmitenListRow {
  string code_name = 1;
  string long_name = 2;
  // map<label, value> dari UI Key Stats, termasuk Cash Flow Statement TTM:
  // "Cash From Operations (TTM)", "Cash From Investing (TTM)",
  // "Cash From Financing (TTM)", "Capital expenditure (TTM)", "Free cash flow (TTM)".
  map<string, string> key_stats = 3;
  // Bentuk: [{"Dividend":[{"Dividend":"Rp 209"},{"Cum Date":"..."},...]}, ...]
  repeated CorporateActionGroup corporate_action = 4;
  CompanyProfile company_profile = 5;
  // RFC3339 / ISO-8601 timestamp string (kosong bila null di Scylla).
  string update_at = 6;
  // Path gcs object
  string emiten_icon = 7;
  // Default false
  bool is_konglomerasi = 8;
  // Nilai enum ↔ kolom Scylla `sector` (tinyint).
  EmitenSector sector = 9;
  bool is_fundamental_solid = 10;
  bool is_blue_chip = 11;
  // Tahun → periode → nilai; bentuk CQL map<text, frozen<map<text, text>>>.
  // Contoh: "2026" → { "Q1": "1,387 B", "Annualised": "5,547 B", "TTM (Q1)": "3,855 B", ... }.
  map<string, NetIncomeYear> net_income = 12;
  // Default false — rencana untuk trade.
  bool is_plan_to_trade = 13;
}

// Satu tahun net income: periode (Q1..Q4, Annualised, TTM ...) → nilai teks.
message NetIncomeYear {
  map<string, string> periods = 1;
}

message GetAllEmitenListResponse {
  repeated EmitenListRow rows = 1;
}
