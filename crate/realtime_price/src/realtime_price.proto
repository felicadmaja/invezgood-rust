syntax = "proto3";

package realtime_price;

service RealtimePrice {
  // Stream harga dari GET `https://exodus.stockbit.com/emitten/{emiten_name}/info`.
  // Setelah client subscribe: tunggu 5 detik lalu GET API pertama; berikutnya 1× / 30 detik
  // **per emiten_name**, dan **hanya** saat ada client yang masih subscribe stream ini.
  // Tanpa subscriber → tidak hit Stockbit API.
  // Beberapa client dengan emiten_name sama berbagi satu poller (fan-out).
  // Jam operasional: Senin–Jumat, 08:55–12:05 dan 13:25–16:05 (waktu server).
  // Di luar jam/hari: stream dari Redis (`stockbit:realtime_price:last:{EMITEN}`).
  // Jika Redis belum ada: tetap GET API sekali untuk seed, simpan Redis; request berikutnya dari Redis.
  // Tanggal merah / cuti bersama / suspend (Senin–Jumat): mulai jam 09:10, bila GET
  // volume masih 0 untuk emiten itu → ditandai libur per emiten
  // (Redis `stockbit:realtime_price:holiday:{YYYY-MM-DD}:{EMITEN}`),
  // poller API dihentikan untuk emiten itu hari itu; stream kirim cache Redis.
  // (Per-emiten: volume=0 bisa karena suspend, bukan libur pasar global.)
  // emiten_name: tepat 4 huruf; dinormalisasi UPPERCASE.
  // Hanya role ADMIN; selain itu PERMISSION_DENIED "Harus admin !".
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetRealtimePriceFromStockbit(GetRealtimePriceFromStockbitRequest)
      returns (stream GetRealtimePriceFromStockbitResponse);
}

message GetRealtimePriceFromStockbitRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE (cuan → CUAN).
  string emiten_name = 1;
}

message CorpActionInfo {
  bool active = 1;
  string icon = 2;
  string text = 3;
  // Kosong bila API mengirim `detail: null`.
  string detail = 4;
}

message GetRealtimePriceFromStockbitResponse {
  string symbol = 1;
  int64 price = 2;
  // Dari field API `formatted_price` (teks angka, di-parse ke int64).
  int64 formatted_price = 3;
  // Dari field API `time` (contoh: "Fri 16:14") — terpisah dari `date`.
  string time = 4;
  int64 volume = 5;
  CorpActionInfo corp_action = 6;
  // Dari field API `date` (contoh: "31 Jul 2026") — terpisah dari `time`.
  string date = 7;
}
