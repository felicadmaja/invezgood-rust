syntax = "proto3";

package rule;

service Rule {
  // Tanpa parameter request; token-ring scan seluruh baris tabel Scylla `rule`.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetAllRule(GetAllRuleRequest) returns (GetAllRuleResponse);

  // Menambahkan rule baru ke tabel Scylla `rule`.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc InsertRule(RuleRow) returns (RuleRow);

  // Mengupdate rule yang sudah ada di tabel Scylla `rule` (PK: rule_name).
  // Jika rule_name tidak ditemukan → NOT_FOUND.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc UpdateRule(RuleRow) returns (RuleRow);

  // Menghapus rule yang sudah ada di tabel Scylla `rule` (PK: rule_name).
  // Jika rule_name tidak ditemukan → NOT_FOUND.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc DeleteRule(DeleteRuleRequest) returns (DeleteRuleResponse);
}

enum RuleGtOrLt {
  LESS_THAN_OR_EQUAL = -2;
  LESS_THAN = -1;
  EQUAL = 0;
  GREATER_THAN = 1;
  GREATER_THAN_OR_EQUAL = 2;
}

message GetAllRuleRequest {}

message DeleteRuleRequest {
  string rule_name = 1;
}

message DeleteRuleResponse {}

message RuleRow {
  string rule_name = 1;
  string rule_description = 2;
  string rule_parameter = 3;
  RuleGtOrLt rule_gt_or_lt = 4;
  double rule_value = 5;
}

message GetAllRuleResponse {
  repeated RuleRow rows = 1;
}
