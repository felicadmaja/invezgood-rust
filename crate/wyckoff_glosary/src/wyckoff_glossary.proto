syntax = "proto3";

package wyckoff_glossary;

service WyckoffGlossary {
  // Insert satu entri ke tabel Scylla `wyckoff_glossary` (PK name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc InsertWyckoffGlossary(InsertWyckoffGlossaryRequest) returns (InsertWyckoffGlossaryResponse);

  // Baca semua entri dari tabel Scylla `wyckoff_glossary` (token-ring scan).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetAllWyckoffGlossary(GetAllWyckoffGlossaryRequest) returns (GetAllWyckoffGlossaryResponse);

  // Update satu entri `wyckoff_glossary` (PK name); kolom `description` saja yang di-update.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc UpdateWyckoffGlossary(UpdateWyckoffGlossaryRequest) returns (UpdateWyckoffGlossaryResponse);

  // Hapus satu entri `wyckoff_glossary` (PK name).
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc DeleteWyckoffGlossary(DeleteWyckoffGlossaryRequest) returns (DeleteWyckoffGlossaryResponse);
}

message WyckoffGlossaryRow {
  string name = 1;
  string description = 2;
}

message InsertWyckoffGlossaryRequest {
  string name = 1;
  string description = 2;
}

message InsertWyckoffGlossaryResponse {
  bool success = 1;
  string message = 2;
}

message GetAllWyckoffGlossaryRequest {}

message GetAllWyckoffGlossaryResponse {
  repeated WyckoffGlossaryRow rows = 1;
}

message UpdateWyckoffGlossaryRequest {
  string name = 1;
  string description = 2;
}

message UpdateWyckoffGlossaryResponse {
  bool success = 1;
  string message = 2;
}

message DeleteWyckoffGlossaryRequest {
  string name = 1;
}

message DeleteWyckoffGlossaryResponse {
  bool success = 1;
  string message = 2;
}
