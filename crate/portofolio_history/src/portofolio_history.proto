syntax = "proto3";

package portofolio_history;

service PortofolioHistory {
  // Baca invezgood.portofolio_history dari Scylla saja (tanpa scrape Stockbit).
  // Response: semua baris per tanggal emiten (tahun_bulan_tanggal DESC).
  // Tersedia setiap hari (Senin–Minggu, hari libur nasional). Auth: login (Bearer session).
  // emiten_name: tepat 4 huruf; dinormalisasi ke UPPERCASE.
  rpc GetPortofolioHistoryByEmitenNameFromScylla(GetPortofolioHistoryByEmitenNameFromScyllaRequest)
      returns (GetPortofolioHistoryByEmitenNameFromScyllaResponse);

  // Baca invezgood.portofolio_history by bulan via MV portofolio_history_by_tahun_bulan.
  // Request: tahun_bulan (YYYY-MM) wajib. Tersedia setiap hari (Senin–Minggu, hari libur).
  // Auth: login (Bearer session). Debug log: {user} {ms}ms - {emiten,...}
  rpc GetPortofolioHistoryByTahunBulanFromScylla(GetPortofolioHistoryByTahunBulanFromScyllaRequest)
      returns (GetPortofolioHistoryByTahunBulanFromScyllaResponse);

  // GET carina.stockbit.com/history?page=&limit=200&period=all&start=&end=&action=&stock={emiten}
  // (paginate s/d meta.max_page) → parse data.history[].history_list[] → upsert invezgood.portofolio_history
  // per tanggal transaksi (UDT portofolio_history_item); response: semua baris emiten di Scylla.
  // Tersedia setiap hari (Senin–Minggu, hari libur).
  // Auth login. Rate limit global 1×/1s.
  // Moka in-memory per emiten: scrape sukses ≤15 menit lalu → skip Stockbit, baca Scylla saja.
  // Response: baca invezgood.portofolio_history dari Scylla (sama seperti FromScylla).
  // Debug log PM2: invoke saat dipanggil; selesai {user} {ms}ms (HIT moka / scrape).
  // Env STOCKBIT_*.
  rpc GetPortofolioHistoryByEmitenNameFromStockbit(GetPortofolioHistoryByEmitenNameFromStockbitRequest)
      returns (GetPortofolioHistoryByEmitenNameFromStockbitResponse);
}

message GetPortofolioHistoryByEmitenNameFromScyllaRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE.
  string emiten_name = 1;
}

message GetPortofolioHistoryByEmitenNameFromStockbitRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE.
  string emiten_name = 1;
}

message GetPortofolioHistoryByTahunBulanFromScyllaRequest {
  // Filter YYYY-MM → MV portofolio_history_by_tahun_bulan.
  string tahun_bulan = 1;
}

message PortofolioHistoryItem {
  string command = 1;
  string symbol = 2;
  double price = 3;
  double lot = 4;
  double amount = 5;
  string status = 6;
}

message PortofolioHistoryRow {
  string emiten_name = 1;
  // Tanggal transaksi YYYY-MM-DD.
  string tahun_bulan_tanggal = 2;
  repeated PortofolioHistoryItem history = 3;
}

message GetPortofolioHistoryByEmitenNameFromScyllaResponse {
  bool success = 1;
  string message = 2;
  repeated PortofolioHistoryRow rows = 3;
}

message GetPortofolioHistoryByTahunBulanFromScyllaResponse {
  bool success = 1;
  string message = 2;
  repeated PortofolioHistoryRow rows = 3;
}

message GetPortofolioHistoryByEmitenNameFromStockbitResponse {
  bool success = 1;
  string message = 2;
  // Semua baris per tanggal transaksi emiten (tahun_bulan_tanggal DESC).
  repeated PortofolioHistoryRow rows = 3;
}
