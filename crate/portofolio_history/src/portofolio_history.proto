syntax = "proto3";

package portofolio_history;

service PortofolioHistory {
  // Baca `portofolio_history` dari Scylla saja (tanpa scrape Stockbit).
  // Request/response sama bentuk Stockbit RPC; baris = snapshot terbaru per emiten
  // (clustering tahun_bulan_tanggal DESC, LIMIT 1).
  // emiten_name: tepat 4 huruf; dinormalisasi ke UPPERCASE.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  rpc GetPortofolioHistoryByEmitenNameFromScylla(GetPortofolioHistoryByEmitenNameFromStockbitRequest)
      returns (GetPortofolioHistoryByEmitenNameFromStockbitResponse);

  // HISTORY DARI PEMBELIAN
  // Ambil riwayat order per emiten dari Stockbit lalu upsert ke `portofolio_history`.
  // Alur: login → START TRADING/PIN bila perlu →
  // GET carina.stockbit.com/order/v2/list?filter_criteria.stock_code={emiten_name}
  // → INSERT portofolio_history (emiten_name, tahun_bulan_tanggal=today, history=list).
  // List = matched order (filter punya time.match/open/order valid).
  // emiten_name: tepat 4 huruf; dinormalisasi ke UPPERCASE.
  // Wajib Authorization: Bearer <JWT valid>; jika tidak valid mengembalikan UNAUTHENTICATED.
  // Rate limit: maksimal 1× per 1 detik untuk semua user (hanya RPC ini; worker scrap tidak terdampak).
  // Hanya jam server 09:00–12:00 dan 13:30–16:00
  // (failed precondition: "Diluar jam 09:00-12:00 dan 13:30-16:00"). Tidak berlaku untuk worker.
  rpc GetPortofolioHistoryByEmitenNameFromStockbit(GetPortofolioHistoryByEmitenNameFromStockbitRequest)
      returns (GetPortofolioHistoryByEmitenNameFromStockbitResponse);
}

message GetPortofolioHistoryByEmitenNameFromStockbitRequest {
  // Kode emiten / ticker: tepat 4 huruf alphabet; dinormalisasi ke UPPERCASE (asbi → ASBI).
  string emiten_name = 1;
}

message PortofolioHistoryItem {
  string command = 1;
  string symbol = 2;
  double price = 3;
  double lot = 4;
  double amount = 5;
  string status = 6;
}

message PortofolioHistoryRow {
  string emiten_name = 1;
  // Tanggal snapshot YYYY-MM-DD (hari invoke scrape).
  string tahun_bulan_tanggal = 2;
  // Urutan seperti hasil API order/v2/list.
  repeated PortofolioHistoryItem history = 3;
}

message GetPortofolioHistoryByEmitenNameFromStockbitResponse {
  bool success = 1;
  string message = 2;
  // Baris `portofolio_history` hari ini setelah upsert; kosong jika gagal.
  PortofolioHistoryRow row = 3;
}
