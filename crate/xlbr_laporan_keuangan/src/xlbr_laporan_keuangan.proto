syntax = "proto3";

package xlbr_laporan_keuangan;

service XlbrLaporanKeuangan {
  // Client stream inlineXBRL.zip (chunk bytes). Server baca semua *.html di zip; cari concept XBRL CurrentYearDuration.
  // Prefer laba rugi 1321000/2311000, arus kas 1510000/1520000/2510000; CapEx fallback beberapa concept PPE/properti.
  // interest_paid / tax_paid dari arus kas; disimpan selalu negatif (outflow, sama seperti CapEx).
  // interest_paid fallback: CF `InterestPaid`/`PaymentsOfFinanceCosts`/adjustment tidak langsung;
  // bila semua nil, pakai beban akrual P&L `InterestAndFinanceCosts`/`FinanceCosts` (mis. ENRG).
  // hutang_berbunga + komponen dari neraca 1210000/2210000/5220000 (`CurrentYearInstant`, snapshot per kuartal).
  // Template sekuritas (5220000): fallback idx-cor:BankLoans, SubordinatedLoans, SubordinatedBonds, Sukuk.
  // OtherBorrowings / NotesPayable (mis. TINS): CurrentMaturitiesOfOtherBorrowings, LongTermOtherBorrowings.
  // kas dari 1210000 idx-cor:CashAndCashEquivalents CurrentYearInstant; fallback 1510000 CashAndCashEquivalentsCashFlows.
  // ebitda_ttm: EBIT=PL+tax+fin_cost−fin_inc; EBITDA=EBIT+D&A; TTM=FY(t−1)−YTD(t−1,Qn)+YTD(t,Qn) — butuh zip Q4 tahun lalu + PriorYearDuration/zip kuartal lalu.
  // quarter dari baris "Periode penyampaian laporan keuangan" di 1000000.html → Q1..Q4.
  // Nilai XBRL YTD kumulatif → dekumulasi hanya vs kuartal sebelumnya yang sudah ada di DB; bila tidak ada, YTD = standalone.
  // Baris sama di-upsert (overwrite). Tidak simpan zip ke disk; buffer in-memory lalu upsert invezgood.xlbr_laporan_keuangan. Bearer login.
  rpc UploadZip(stream UploadZipChunk) returns (UploadZipResponse);

  // Scrape idx.co.id laporan keuangan (Chrome BEI terpisah dari Stockbit): reset cookie idx.co.id,
  // cari emiten, loop year4..year0 × period0..3, unduh inlineXBRL.zip bila ada, simpan ke
  // src/downloaded_xbrl/{CODE}/inlineXBRL-{CODE}-{tahun}-{Qn}.zip, parse+upsert invezgood.xlbr_laporan_keuangan.
  // crate/xlbr_laporan_keuangan/browser_data — tidak mengunci Chrome Stockbit.
  // Awal RPC: hapus semua file di src/screenshot/; screenshot langkah ke {code}-*.png.
  // Zip unduhan disimpan permanen: src/downloaded_xbrl/{CODE}/inlineXBRL-{CODE}-{tahun}-{Qn}.zip
  // (year4=tahun ini−4..year0=tahun ini; period0=Q1..period3=Q4). Bila file sudah ada, slot dilewati.
  // year0: lewati period0 jika bulan≤3, period1 bulan≤6, period2 bulan≤9, period3 selama masih tahun kalender sama.
  // Retry goto IDX bila 503 Varnish (env XLBR_IDX_GOTO_RETRIES, XLBR_IDX_RETRY_SECS). Bearer login.
  // RPC menunggu scrape selesai lalu kirim uploaded/skipped/failed + fiscal_year/quarter terakhir.
  // Satu worker serial: invoke paralel diantrikan FIFO, diproses satu per satu (tidak membatalkan job sebelumnya).
  rpc ScrapZipFromBei(ScrapZipFromBeiRequest) returns (UploadZipResponse);

  // Baca hingga 20 baris (5 tahun × 4 kuartal) per code untuk grafik client. Bearer login.
  rpc GetChartByCode(GetXlbrChartByCodeRequest) returns (GetXlbrChartByCodeResponse);

  // Baca catatan map emiten dari invezgood.xlbr_laporan_keuangan (baris kuartal terbaru per code). Bearer login.
  rpc GetCatatanByCode(GetCatatanByCodeRequest) returns (GetCatatanByCodeResponse);

  // Upsert catatan map ke semua baris kuartal emiten yang sama (overwrite map). Bearer login.
  rpc UpsertCatatanByCode(UpsertCatatanByCodeRequest) returns (UpsertCatatanByCodeResponse);

  // Unduh inlineXBRL zip dari src/downloaded_xbrl/{CODE}/. tahun_quarter repeated (contoh 2026-Q1):
  // 1 item → stream file tunggal; >1 item → bundel zip terpilih; kosong → bundel semua zip emiten. Bearer login.
  rpc DownloadInlineXBRL(DownloadInlineXBRLRequest) returns (stream DownloadInlineXBRLResponse);
}

message UploadZipChunk {
  bytes data = 1;
}

message UploadZipResponse {
  bool success = 1;
  string message = 2;
  string code = 3;
  int32 fiscal_year = 4;
  string quarter = 5;
}

message ScrapZipFromBeiRequest {
  string code = 1; // uppercase emiten BEI
}

message GetXlbrChartByCodeRequest {
  string code = 1;
}

message XlbrChartPoint {
  int32 fiscal_year = 1;
  string quarter = 2;
  int64 period_end = 3;
  double cash_from_operation = 4;
  double cash_from_investment = 5;
  double cash_from_financing = 6;
  double capital_expenditure = 7;
  double free_cash_flow = 8;
  double net_income = 9;
  string presentation_currency = 10;
  int32 unit_scale = 11;
  map<string, string> catatan = 12;
  double interest_paid = 13;
  double tax_paid = 14;
  double st_bank_loans = 15;
  double current_maturities = 16;
  double lt_loans = 17;
  double bonds = 18;
  double sukuk = 19;
  double lease_liabilities = 20;
  double hutang_berbunga = 21;
  double kas = 22;
  double ebitda_ttm = 23;
}

message GetXlbrChartByCodeResponse {
  bool success = 1;
  string message = 2;
  string code = 3;
  repeated XlbrChartPoint points = 4;
}

message GetCatatanByCodeRequest {
  string code = 1;
}

message GetCatatanByCodeResponse {
  bool success = 1;
  string message = 2;
  string code = 3;
  map<string, string> catatan = 4;
}

message UpsertCatatanByCodeRequest {
  string code = 1;
  map<string, string> catatan = 2;
}

message UpsertCatatanByCodeResponse {
  bool success = 1;
  string message = 2;
  string code = 3;
}

message DownloadInlineXBRLRequest {
  string code = 1;
  repeated string tahun_quarter = 2; // format "{tahun}-{quarter}", contoh 2026-Q1; kosong = bundel semua zip emiten
}

message DownloadInlineXBRLResponse {
  bool success = 1;
  string message = 2;
  bytes data = 3;
}
