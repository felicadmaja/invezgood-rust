syntax = "proto3";

package xlbr_laporan_keuangan;

service XlbrLaporanKeuangan {
  // Client stream inlineXBRL.zip (chunk bytes). Server baca semua *.html di zip; cari concept XBRL CurrentYearDuration.
  // Prefer laba rugi 1321000/2311000, arus kas 1510000/2510000; CapEx fallback beberapa concept PPE/properti.
  // quarter dari baris "Periode penyampaian laporan keuangan" di 1000000.html → TW1..TW4.
  // Nilai XBRL YTD kumulatif → dekumulasi hanya vs kuartal sebelumnya yang sudah ada di DB; bila tidak ada, YTD = standalone.
  // Baris sama di-upsert (overwrite). Tidak simpan zip ke disk; buffer in-memory lalu upsert invezgood.xlbr_laporan_keuangan. Bearer login.
  rpc UploadZip(stream UploadZipChunk) returns (UploadZipResponse);

  // Scrape idx.co.id laporan keuangan (Chrome pool Stockbit): cari emiten, loop year4..year0 × period0..3,
  // unduh inlineXBRL.zip bila ada, parse+upsert invezgood.xlbr_laporan_keuangan, hapus zip temp.
  // Awal RPC: hapus semua file di src/screenshot/; screenshot langkah ke {code}-*.png; zip temp downloaded_xbrl/{code}-N.zip.
  // Retry goto IDX bila 503 Varnish (env XLBR_IDX_GOTO_RETRIES, XLBR_IDX_RETRY_SECS). Publik — tanpa JWT.
  // Scrape di background task terpisah — RPC langsung return; client boleh disconnect/logout.
  // Invoke baru membatalkan scrap sebelumnya (lepaskan Chrome lock). Log: ScrapZipFromBei background.
  rpc ScrapZipFromBei(ScrapZipFromBeiRequest) returns (UploadZipResponse);

  // Baca hingga 20 baris (5 tahun × 4 kuartal) per code untuk grafik client. Publik — tanpa JWT.
  rpc GetChartByCode(GetXlbrChartByCodeRequest) returns (GetXlbrChartByCodeResponse);
}

message UploadZipChunk {
  bytes data = 1;
}

message UploadZipResponse {
  bool success = 1;
  string message = 2;
  string code = 3;
  int32 fiscal_year = 4;
  string quarter = 5;
}

message ScrapZipFromBeiRequest {
  string code = 1; // uppercase emiten BEI
}

message GetXlbrChartByCodeRequest {
  string code = 1;
}

message XlbrChartPoint {
  int32 fiscal_year = 1;
  string quarter = 2;
  int64 period_end = 3;
  double cash_from_operation = 4;
  double cash_from_investment = 5;
  double cash_from_financing = 6;
  double capital_expenditure = 7;
  double free_cash_flow = 8;
  double net_income = 9;
  string presentation_currency = 10;
  int32 unit_scale = 11;
}

message GetXlbrChartByCodeResponse {
  bool success = 1;
  string message = 2;
  string code = 3;
  repeated XlbrChartPoint points = 4;
}
