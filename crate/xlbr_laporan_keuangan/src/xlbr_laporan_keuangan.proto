syntax = "proto3";

package xlbr_laporan_keuangan;

service XlbrLaporanKeuangan {
  // Client stream inlineXBRL.zip (chunk bytes). Server baca semua *.html di zip; cari concept XBRL CurrentYearDuration.
  // Prefer laba rugi 1321000/2311000, arus kas 1510000/2510000; CapEx fallback beberapa concept PPE/properti.
  // quarter dari baris "Periode penyampaian laporan keuangan" di 1000000.html → TW1..TW4.
  // Nilai XBRL kuartal YTD kumulatif → dekumulasi vs jumlah kuartal sebelumnya di DB.
  // TW2+ butuh kuartal sebelumnya sudah ada untuk dekumulasi; baris sama di-upsert (overwrite).
  // Tidak simpan zip ke disk; buffer in-memory lalu upsert invezgood.xlbr_laporan_keuangan. Bearer login.
  rpc UploadZip(stream UploadZipChunk) returns (UploadZipResponse);

  // Baca hingga 20 baris (5 tahun × 4 kuartal) per code untuk grafik client. Bearer login.
  rpc GetChartByCode(GetXlbrChartByCodeRequest) returns (GetXlbrChartByCodeResponse);
}

message UploadZipChunk {
  bytes data = 1;
}

message UploadZipResponse {
  bool success = 1;
  string message = 2;
  string code = 3;
  int32 fiscal_year = 4;
  string quarter = 5;
}

message GetXlbrChartByCodeRequest {
  string code = 1;
}

message XlbrChartPoint {
  int32 fiscal_year = 1;
  string quarter = 2;
  int64 period_end = 3;
  double cash_from_operation = 4;
  double cash_from_investment = 5;
  double cash_from_financing = 6;
  double capital_expenditure = 7;
  double free_cash_flow = 8;
  double net_income = 9;
  string presentation_currency = 10;
  int32 unit_scale = 11;
}

message GetXlbrChartByCodeResponse {
  bool success = 1;
  string message = 2;
  string code = 3;
  repeated XlbrChartPoint points = 4;
}
