[package]
name = "stockbit_ws"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "stockbit_ws"
path = "src/main.rs"

[dependencies]
dotenvy = "0.15"
bandarmology = { path = "../crate/bandarmology" }
broker = { path = "../crate/broker" }
emiten_list = { path = "../crate/emiten_list" }
emiten_trending = { path = "../crate/emiten_trending" }
emiten_trending_count = { path = "../crate/emiten_trending_count" }
gcs = { path = "../crate/gcs" }
pending_order = { path = "../crate/pending_order" }
portofolio = { path = "../crate/portofolio" }
tls = { path = "../crate/tls" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tonic = { version = "0.12", features = ["transport", "tls"] }
tonic-reflection = "0.12"
user = { path = "../crate/user" }
