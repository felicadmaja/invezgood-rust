[package]
name = "invezgood"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "invezgood"
path = "src/main.rs"

[dependencies]
dotenvy = "0.15"
stock_list = { path = "../crate/stock_list" }
user = { path = "../crate/user" }
top_gainer_loser = { path = "../crate/top_gainer_loser" }
bandarmology = { path = "../crate/bandarmology" }
broker = { path = "../crate/broker" }
portofolio = { path = "../crate/portofolio" }
portofolio_equity = { path = "../crate/portofolio_equity" }
portofolio_history = { path = "../crate/portofolio_history" }
pending_order = { path = "../crate/pending_order" }
emiten_trending = { path = "../crate/emiten_trending" }
chart = { path = "../crate/chart" }
haka_haki = { path = "../crate/haka_haki" }
hari_libur = { path = "../crate/hari_libur" }
market_holiday = { path = "../crate/market_holiday" }
msci = { path = "../crate/msci" }
stockbit_browser = { path = "../crate/stockbit_browser" }
wyckoff_glossary = { path = "../crate/wyckoff_glosary" }
worker_scrapping = { path = "../worker_scrapping" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tls = { path = "../crate/tls" }
grpc_server = { path = "../crate/grpc_server" }
tonic = { version = "0.12", features = ["tls", "gzip"] }
tonic-reflection = "0.12"
prost = "0.13"

[build-dependencies]
tonic-build = "0.12"
