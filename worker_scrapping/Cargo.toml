[package]
name = "worker_scrapping"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "worker_scrapping"
path = "worker_scrapping.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chromiumoxide = "0.9"
dotenvy = "0.15"
futures = "0.3"
rand = "0.8"
scylla = { version = "1.5", features = ["chrono-04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs"] }
uuid = { version = "1", features = ["v4"] }
