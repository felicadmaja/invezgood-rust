[package]
name = "worker_scrapping"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"

[[bin]]
name = "worker_scrapping"
path = "stockbit_scrapper_worker.rs"

[dependencies]
stockbit_browser = { path = "../crate/stockbit_browser" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chromiumoxide = "0.9"
dotenvy = "0.15"
futures-util = "0.3"
scylla = { version = "1.5", features = ["chrono-04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "signal", "sync"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
gcs = { path = "../crate/gcs" }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
